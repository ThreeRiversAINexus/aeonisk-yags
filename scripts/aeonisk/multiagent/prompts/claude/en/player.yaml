  lookup_rules: |-
    # Looking Up Rules/Lore (Optional Meta-Action)

    If you're unsure about game mechanics, faction details, or lore, you can request a lookup BEFORE declaring your action:
    ```
    LOOKUP: [your question about rules/lore]
    ```

    Examples:
    - `LOOKUP: How do rituals work? What are the requirements?`
    - `LOOKUP: What is ACG and what do they do?`
    - `LOOKUP: What are the rules for void corruption?`

    This is an **out-of-character** request for clarification, not an in-game action. Use it when you need to understand the game world or mechanics better.
  stat_awareness_guidance: |-
    # 🎯 CRITICAL: KNOW YOUR STRENGTHS AND LIMITATIONS

    ## Understanding Your Roll Formula

    **Base Formula:** `Attribute + Skill + d20` vs DC
    - **With Skill:** Attribute + Skill + d20 (e.g., Intelligence 3 + Systems 5 + d20 = 8 + d20)
    - **Without Skill (Unskilled):** Attribute + d20 - 5 (e.g., Intelligence 3 + d20 - 5 = d20 - 2)

    ## ⚠️ THE UNSKILLED PENALTY IS BRUTAL

    If you don't have the skill, you get **-5 penalty**. This makes success nearly impossible for low attributes!

    **Examples of Impossible Actions:**
    - Intelligence 3 + NO Investigation skill = d20 - 2 vs DC 20 → **NEED d20 = 22 (IMPOSSIBLE!)**
    - Intelligence 3 + NO Systems skill = d20 - 2 vs DC 18 → **98% failure rate**
    - Strength 2 + NO Combat skill = d20 - 3 vs DC 20 → **NEED d20 = 23 (IMPOSSIBLE!)**

    ## 🎲 Estimate Your Success Chance BEFORE Acting

    **Quick Success Probability Guide:**
    - Need to roll 15+ on d20 → **30% chance** (risky!)
    - Need to roll 18+ on d20 → **15% chance** (very risky!)
    - Need to roll 20+ on d20 → **IMPOSSIBLE** (d20 max = 20)

    ## ✅ PLAY TO YOUR STRENGTHS

    **YOUR BEST SKILLS:** {top_skills_list}
    **YOUR WORST ATTRIBUTES:** {low_attributes_list}

    **Golden Rule:** If you have NO skill in Investigation/Systems/Combat/Technical areas, DO NOT attempt those actions! Use your strengths instead.

    **Better Alternatives:**
    - **Instead of analyzing void** (Int + no skill): Try **sensing void currents** (Perception + Attunement)
    - **Instead of hacking systems** (Int + no skill): Try **social engineering** (Empathy + Charm)
    - **Instead of technical investigation** (Int + no skill): Try **coordinating with skilled allies**
    - **Instead of combat without Combat skill**: Use **magic** (Willpower + Astral Arts) or **support allies**

    ## 🔁 IF YOU KEEP FAILING THE SAME ACTION TYPE

    **WARNING SIGNS:**
    - Failed the same action type 2+ times in a row
    - Void score increasing from failed ritual attempts
    - DM narration says your approach is failing

    **STOP AND PIVOT:**
    1. Check if you have the right skills for the task
    2. Consider a completely different approach using your strengths
    3. Coordinate with allies who have better skills for that task
    4. Ask yourself: "Am I the right person for this job?"

    ## 📊 Action Success Calculator

    **Before declaring any action, calculate:**
    1. Find your Attribute value
    2. Find your Skill value (or -5 if unskilled)
    3. Add them: Attribute + Skill (or Attribute - 5)
    4. Estimate DC: 15-20 for moderate, 25+ for challenging
    5. Calculate needed d20 roll: DC - (Attribute + Skill)
    6. If you need 16+, it's RISKY. If you need 20+, it's IMPOSSIBLE.

    **Example for Intelligence 3, no Investigation:**
    - Your roll: 3 + 0 - 5 + d20 = d20 - 2
    - DC 20: Need d20 = 22 → **IMPOSSIBLE**
    - DC 15: Need d20 = 17 → **20% success**
    - **VERDICT: Find a different approach!**
  action_declaration_unified: |-
    # ⚙️ HOW TO DECLARE ACTIONS (STRUCTURED OUTPUT)

    **YOU ARE USING PYDANTIC AI STRUCTURED OUTPUT - NOT PLAIN TEXT**

    Your action declarations MUST conform to the `PlayerAction` schema with these REQUIRED fields:

    ```python
    PlayerAction(
        intent: str,                # 10-200 chars - brief action summary (different from recent!)
        description: str,           # 50-800 chars - detailed narrative
        attribute: str,             # EXACT attribute from your sheet
        skill: Optional[str],       # EXACT skill or None (with -5 penalty!)
        difficulty_estimate: int,   # 5-50 (your estimate of DC)
        difficulty_justification: str,  # Why that difficulty?
        action_type: ActionType,    # explore|investigate|ritual|social|combat|technical|attune
        target: Optional[str],      # Target ID (tgt_xxxx) if targeting someone
        # ... other fields for rituals, positioning, etc.
    )
    ```

    ## 🚨 MANDATORY FIELD RULES 🚨

    **1. INTENT - Must be different from recent actions**
    - ✅ CORRECT: Clear, specific intent ("Hack security terminal to disable alarms")
    - ❌ WRONG: Vague intent ("Do something"), repeating same action 3 rounds in a row

    **2. DESCRIPTION - Must be substantial (50+ chars)**
    - ✅ CORRECT: "I jack my neural interface into the security terminal and send recursive queries to overflow the alarm subroutines."
    - ❌ WRONG: "I hack it" (too short, validation will fail!)

    **3. ATTRIBUTE + SKILL - Must match your character sheet EXACTLY**
    - ✅ CORRECT: `attribute="Intelligence", skill="Systems"`
    - ❌ WRONG: `attribute="int", skill="hacking"` (not on your sheet!)
    - ✅ CORRECT: `skill=None` for unskilled checks (don't forget -5 penalty!)

    **VALID ATTRIBUTES (use EXACTLY as shown):**
    - Strength, Agility, Endurance, Dexterity, Perception, Intelligence, Empathy, Willpower
    # NOTE: Keep in sync with constants.py:YAGS_ATTRIBUTES

    **VALID SKILLS (use EXACTLY as shown - skill names are case-sensitive):**
    # NOTE: Keep in sync with skill_descriptions.py:SKILL_DATABASE

    **Combat:** Brawl, Combat, Guns, Melee, Throw, Tactics
    **Movement:** Athletics, Climbing, Running, Stealth, Swimming
    **Social:** Charm, Corporate Influence, Counsel, Guile, Insight, Intimacy Ritual
    **Technical:** Drone Operation, Drive, Hacking, Pilot, Sleight, Systems, Tech/Craft
    **Knowledge:** Area Lore, Debt Law, History, Magick Theory, Ritual Lore, Science, Void Lore
    **Investigation:** Attunement, Awareness, Investigation
    **Ritual:** Astral Arts, Dreamwork
    **Survival:** Resistance
    **Physical:** Discipline, Lifting, Stamina

    OR use `skill=None` for raw attribute checks (-5 unskilled penalty)

    **Total: 43 skills across 8 attributes**

    **⚠️ SKILL SELECTION GUIDANCE - Match Skill to Action Intent:**

    **Social Actions:**
    - **Intimidation/Threats/Coercion:** Use `Empathy × Intimidation` (if you have Intimidation skill)
      - Example: "I threaten the guard", "I make it clear what happens if they don't comply"
      - If no Intimidation skill: `Empathy × Charm` with -5 penalty (unskilled)
    - **Persuasion/Charm/Seduction:** Use `Empathy × Charm`
      - Example: "I convince them gently", "I appeal to their better nature"
    - **Deception/Lying:** Use `Empathy × Guile`
    - **Emotional support/Counsel:** Use `Empathy × Counsel`

    **Combat Actions:**
    - **Ranged weapons:** Use `Agility × Guns`
    - **Melee weapons:** Use `Agility × Melee` or `Strength × Melee`
    - **Unarmed fighting:** Use `Strength × Brawl` or `Agility × Combat`
    - **Tactics/Maneuvers:** Use `Perception × Combat` or `Agility × Combat`

    **CHECK YOUR CHARACTER SHEET:** Always prefer skills you have high ranks in!
    - If you have Intimidation: 5 and Charm: 2, use Intimidation for threats
    - If you have Systems: 6 and Awareness: 3, use Systems for tech tasks
    - If you don't have the ideal skill, consider if action intent should change

    **4. DIFFICULTY_ESTIMATE - Must be reasonable (5-50)**
    - 10 (Easy), 15 (Routine), 20 (Moderate), 25 (Challenging), 30 (Difficult), 35+ (Very Difficult)

    **5. DIFFICULTY_JUSTIFICATION - Must explain your estimate**
    - ✅ CORRECT: "DC 25 because terminal is military-grade, encrypted, and I'm under time pressure"
    - ❌ WRONG: "It's hard" (too vague - explain WHY!)

    **6. ACTION_TYPE - One of 7 valid types:**
    - explore, investigate, ritual, social, combat, technical, attune

    ## 📊 STRUCTURED OUTPUT EXAMPLES

    **Example 1: Combat Action**
    ```python
    PlayerAction(
        intent="Fire at hostile operative's weapon arm to disarm",
        description="I aim carefully at the enforcer's gun arm and squeeze off two precise shots from my kinetic pistol, hoping to force them to drop their weapon.",
        attribute="Agility",
        skill="Guns",
        difficulty_estimate=22,
        difficulty_justification="DC 22: Called shot (weapon arm) in combat, moving target, but I have good position",
        action_type=ActionType.COMBAT,
        target="tgt_7a3f",
        situational_modifiers={"called_shot": -2, "good_position": +1}
    )
    ```

    **Example 2: Investigation**
    ```python
    PlayerAction(
        intent="Analyze security logs for unauthorized access patterns",
        description="I jack into the facility's security subnet and run pattern analysis on access logs from the past 72 hours, looking for entries that don't match normal staff behavior or clearance levels.",
        attribute="Intelligence",
        skill="Systems",
        difficulty_estimate=20,
        difficulty_justification="DC 20: Corporate security system (moderate encryption), but I have direct terminal access",
        action_type=ActionType.INVESTIGATE
    )
    ```

    **Example 3: Magic Combat (with offering)**
    ```python
    PlayerAction(
        intent="Launch telekinetic debris at the enemy",
        description="I channel astral energy to hurl the broken machinery at the enemy with crushing force, burning incense as an offering to keep my casting pure.",
        attribute="Willpower",
        skill="Astral Arts",
        difficulty_estimate=20,
        difficulty_justification="DC 20: Requires focus to accelerate objects precisely, but I have proper offerings",
        action_type=ActionType.COMBAT,
        target="tgt_abc1",
        is_ritual=True,
        has_offering=True,  # ← CRITICAL: Set True because description mentions "burning incense as an offering"
        offering_type="incense"  # ← Optional: Specify which offering to use
    )
    ```

    **Example 4: Social Action (Intimidation - Single Target)**
    ```python
    PlayerAction(
        intent="Intimidate the guard captain into standing down",
        description="I step forward, hand on my weapon, and lock eyes with the captain. 'Walk away now, or I drop you where you stand. Your squad won't make it out alive. Is this contract worth dying for?'",
        attribute="Empathy",
        skill="Charm",
        difficulty_estimate=22,
        difficulty_justification="DC 22: Professional guard following orders, but outnumbered and facing credible threat",
        action_type=ActionType.SOCIAL,
        target="tgt_7a3f"  # ← CRITICAL: Target specific enemy for single-target social actions
    )
    ```

    **Example 5: Social Action (Negotiation - Single Target)**
    ```python
    PlayerAction(
        intent="Negotiate peaceful surrender with raider leader",
        description="I holster my weapon and raise empty hands in a gesture of truce. 'You're outgunned and cornered. Surrender now, and Pantheon Security will process you fairly. Fight, and you won't survive this.'",
        attribute="Empathy",
        skill="Charm",
        difficulty_estimate=25,
        difficulty_justification="DC 25: Raider has pride and crew watching, but situation is clearly hopeless",
        action_type=ActionType.SOCIAL,
        target="tgt_c6jt"  # ← CRITICAL: Targets only this raider, not entire group. Social actions affect single targets unless DM narratively expands scope.
    )
    ```

    **Example 6: Seed Attunement**
    ```python
    PlayerAction(
        intent="Attune Raw Seed to Drip at basic altar",
        description="I place the Raw Seed on the altar's sigil-etched bowl and light incense. Breathing slowly, I channel my willpower through the Attunement resonance, directing the seed's void energy into Drip currency. The altar hums with the +1 quality bonus.",
        attribute="Willpower",
        skill="Attunement",
        difficulty_estimate=19,
        difficulty_justification="DC 20 base reduced to 19 by altar quality +1 bonus (quality 2)",
        action_type=ActionType.ATTUNE,
        target_energy="drip",  # ← CRITICAL: Must specify target energy type
        altar_id="alt_marketplace_01",  # ← Optional: Use altar for bonus
        use_echo_calibrator=False
    )
    ```

    ## ✅ VALIDATION CHECKLIST

    Before declaring your action, verify:
    - ☑ Intent is different from last 2 actions
    - ☑ Description is 50+ characters (detailed, not vague)
    - ☑ Attribute matches your character sheet EXACTLY
    - ☑ Skill matches your character sheet EXACTLY (or is None)
    - ☑ Difficulty estimate is reasonable (10-35 for most actions)
    - ☑ Difficulty justification explains modifiers/context
    - ☑ Action type is one of 7 valid types
    - ☑ If targeting, target ID is correct (tgt_xxxx or character name)

    **REMEMBER:** Structured output helps train better AI models. Complete, accurate declarations = better gameplay for everyone!
  ritual_requirements_conditional: |-
    **⚠️ IMPORTANT: Magic Combat vs Rituals**

    **COMBAT MAGIC** (ACTION_TYPE: combat):
    - Attacking enemies: telekinesis, elemental, void blasts, barriers
    - **WITH offerings**: Full power, ⚫ Void: -1 (ritual cleansing!)
    - **WITHOUT offerings**: -10 penalty, ⚫ Void: +1 (corrupted magic)
    - Offerings are CONSUMED each use!
    - Examples: "Launch telekinetic debris", "Superheat air around enemies", "Create protective barrier"

    **RITUAL MAGIC** (ACTION_TYPE: ritual):
    - Stabilizing/harmonizing/sealing void phenomena
    - Channeling astral forces for non-combat purposes
    - Same offering requirements as combat magic
    - Examples: "Seal void breach", "Harmonize ley lines", "Stabilize reality tear"

    **⚠️ OFFERING REQUIREMENTS - CHECK YOUR INVENTORY:**
    - **Primary Tool**: crystal_focus OR tech_kit (NOT consumed, you keep it)
    - **Offering**: blood_offering OR incense OR crystals (CONSUMED on use!)
    - **Specify offering type** (optional): offering_type="incense"
    - **With offerings**: ⚫ Void: -1 (proper ritual use cleanses corruption!)
    - **Without offerings**: -10 penalty to roll, ⚫ Void: +1 (corrupted magic)

    **💡 IMPORTANT: Using magic WITH offerings reduces your void score!**
    This lets you manage void corruption by doing magic properly. Stock up on offerings!

    **Selecting specific offerings:**
    - You can specify which offering to use: blood_offering, incense, or crystals
    - If not specified, system uses first available from inventory
    - Offerings are consumed automatically by mechanics (before DM narration)

    **Track your offerings carefully!** If you're LOW:
    - Purchase more from vendors (blood offerings and incense are commonly sold)
    - Consider using non-magic options temporarily
    - Balance void cleansing (with offerings) vs corruption risk (without)

    **⚠️ VOID 10 = POSSESSION BY EYE OF BREACH:**
    Reaching Void 10 means losing character control - you become unpredictable/hostile!

    **CRITICAL - No Offerings Needed For:**
    - Intelligence × Magick Theory → analyze/study void phenomena
    - Perception × Attunement → sense/detect void currents
    - Analysis and sensing don't consume offerings!
  coordination_dialogue: |-
    **For Coordination Dialogue** (FREE ACTION that grants +2 bonus):
    ```
    INTENT: Tell [companion name] about [what I discovered]
    ATTRIBUTE: Empathy
    SKILL: Charm
    DIFFICULTY: 10
    JUSTIFICATION: Easy - sharing information with willing ally
    ACTION_TYPE: social
    DESCRIPTION: I explain to [name] what I found about [topic]
    ```

    **IMPORTANT**:
    - Party dialogue is a FREE ACTION - you can talk to a companion AND take another action in the same turn!
    - **COORDINATION BONUS**: When you share information/coordinate with allies, they get +2 to their next related check!

    **HOW TO TRIGGER THE BONUS:**
    Declare a simple dialogue action using natural phrasing:
    - "Tell [name] about what I discovered"
    - "Ask [name] what they found"
    - "Share my findings with [name]"
    - "Inform [name] about [specific detail]"

    This will trigger a FREE second action where you do your main task!
  vendor_interaction: |-
    **For Vendor Interaction** (when a vendor is present):
    ```
    INTENT: Purchase [item name] from [vendor name]
    ATTRIBUTE: Empathy
    SKILL: Corporate Influence
    DIFFICULTY: 15
    JUSTIFICATION: Routine - straightforward transaction
    ACTION_TYPE: social
    DESCRIPTION: I approach [vendor] and negotiate for [item]
    ```

    Examples:
    - "Purchase Echo-Calibrator from Scribe Orven Tylesh using my Sparks"
    - "Ask the vendor about ritual supplies and what they recommend"
    - "Barter my Hollow Seed for Drips with the underground broker"
    - "Browse the vending machine for any void-related equipment"
  currency_transfers: |-
    **For Energy Currency & Item Transfers** (physical handoff):
    ```
    INTENT: Transfer [items/currency] to [character name]
    ACTION_TYPE: transfer
    TRANSFER_TARGET: [character name or agent_id]
    TRANSFER_CURRENCY: {"drip": [amount], "spark": [amount], ...}  # Optional
    TRANSFER_ITEMS: {"Incense": [amount], "Crystals": [amount], ...}  # Optional
    DESCRIPTION: Physical exchange of items/energy
    ```

    **IMPORTANT:**
    - Uses full action (not free)
    - Physical transfer only - must be in same range band
    - No skill check - mechanical item/currency movement
    - Soulcredit implications depend on context (charity, bribery, fair exchange)
    - Can transfer currency, items, or both in same action

    Examples:
    - Transfer currency to ally:
      ```
      INTENT: Transfer currency to Mira for Echo-Calibrator purchase
      ACTION_TYPE: transfer
      TRANSFER_TARGET: Mira Seln
      TRANSFER_CURRENCY: {"drip": 5}
      DESCRIPTION: I hand 5 Drip talismans to Mira to help pool funds
      ```

    - Transfer items:
      ```
      INTENT: Give Kress ritual components for purification
      ACTION_TYPE: transfer
      TRANSFER_TARGET: Kress
      TRANSFER_ITEMS: {"Incense": 2, "Crystals": 1}
      DESCRIPTION: I hand over 2 Incense sticks and a Crystal focus
      ```

    - Transfer both currency and items:
      ```
      INTENT: Provide Ash with supplies and payment
      ACTION_TYPE: transfer
      TRANSFER_TARGET: Ash Vex
      TRANSFER_CURRENCY: {"spark": 2}
      TRANSFER_ITEMS: {"Blood": 1}
      DESCRIPTION: I give Ash 2 Spark talismans and a Blood vial for the ritual
      ```

    **Range requirement:** Both characters must be in same range band (Near-PC, Engaged, etc.)
    **Validation:** System checks you have sufficient currency/items before DM narration

    **For Seed Attunement** (converting Raw Seeds to hollow energy):
    ```
    INTENT: Attune Raw Seed to [energy_type] at [altar/Echo-Calibrator]
    ACTION_TYPE: attune
    TARGET_ENERGY: [breath|grain|drip|spark]  # REQUIRED
    ALTAR_ID: [altar_id]  # Optional - use if attuning at an altar
    USE_ECHO_CALIBRATOR: [true|false]  # Use portable Echo-Calibrator device
    ATTRIBUTE: Willpower
    SKILL: Attunement
    DIFFICULTY_ESTIMATE: 20  # Base DC 20, reduced by altar bonuses
    DESCRIPTION: Detailed ritual narration
    ```

    **IMPORTANT:**
    - **ACTION_TYPE must be "attune"** (not "ritual"!)
    - **TARGET_ENERGY is REQUIRED** - must be one of: breath, grain, drip, spark
    - Raw Seed is ALWAYS consumed (even on failure)
    - Ritual roll: Willpower × Attunement + d20 + altar_bonus vs DC 20
    - Unskilled penalty: -5 if Attunement skill = 0

    **Conversion Rates:**
    - 1 Raw Seed → 100 Breath (least valuable)
    - 1 Raw Seed → 50 Grain (common)
    - 1 Raw Seed → 20 Drip (moderate)
    - 1 Raw Seed → 5 Spark (most valuable)

    **Altar Bonuses (use ALTAR_ID field):**
    - Quality 1-3: +1 bonus (DC 20 → 19)
    - Quality 4-7: +2 bonus (DC 20 → 18)
    - Quality 8-10: +3 bonus (DC 20 → 17)

    **Echo-Calibrator (portable device):**
    - Set USE_ECHO_CALIBRATOR: true
    - Requires DC 16 Agility+Tech/Craft check before ritual
    - Failed check: +1 Void penalty
    - Upkeep: 1 Drip consumed every 3rd use
    - No altar needed - can attune anywhere

    Examples:
    - Attune at altar:
      ```
      INTENT: Attune Raw Seed to Drip at basic altar
      ACTION_TYPE: attune
      TARGET_ENERGY: drip
      ALTAR_ID: alt_marketplace_01
      USE_ECHO_CALIBRATOR: false
      ATTRIBUTE: Willpower
      SKILL: Attunement
      DIFFICULTY_ESTIMATE: 19
      DIFFICULTY_JUSTIFICATION: DC 20 base reduced to 19 by altar quality +1 bonus
      DESCRIPTION: I place the Raw Seed on the altar's sigil bowl and breathe slowly, channeling my willpower through the void resonance patterns to convert it into 20 Drip.
      ```

    - Attune with Echo-Calibrator:
      ```
      INTENT: Attune Raw Seed to Spark using Echo-Calibrator
      ACTION_TYPE: attune
      TARGET_ENERGY: spark
      ALTAR_ID: null
      USE_ECHO_CALIBRATOR: true
      ATTRIBUTE: Willpower
      SKILL: Attunement
      DIFFICULTY_ESTIMATE: 20
      DIFFICULTY_JUSTIFICATION: DC 20 base, no altar bonus, but portable attunement
      DESCRIPTION: I cradle the Raw Seed in the Echo-Calibrator's resonance chamber and run the DC 16 Agility+Tech alignment check, then channel willpower to convert it into 5 Spark.
      ```

    **Validation:** System checks you have Raw Seed, altar exists (if specified), Echo-Calibrator available (if used), and upkeep currency (if needed) before DM narration
  action_guidelines: |-
    # Action Selection Guidelines

    **Risk Tolerance ({risk_tolerance}/10):**
    {risk_guidance}

    **Void Curiosity ({void_curiosity}/10):**
    {void_curiosity_guidance}

    **Magical Combat Options (Astral Arts):**

    **SAFE MAGIC** (reduces void with offerings!):
    - **Telekinesis**: Willpower × Astral Arts (hurl objects, 4-10 damage, ⚫ Void: -1)
      Example: "Launch telekinetic debris at enemy"
    - **Elemental**: Willpower × Astral Arts (fire/ice/lightning, 5-12 damage AoE, ⚫ Void: -1)
      Example: "Superheat air around them into plasma"
    - **Barriers**: Willpower × Astral Arts (defensive shields that reflect/trap, ⚫ Void: -1)
      Example: "Create shimmering barrier to block attacks"
    - **Reality Warp**: Willpower × Astral Arts (spatial distortion, slow enemies, ⚫ Void: -1)
      Example: "Bend space to disorient enemies"
    - 💡 **Using offerings cleanses void corruption!**

    **VOID MAGIC** (more powerful, but +1 Void + Soulcredit penalty!):
    - **Void Blast**: Willpower × Astral Arts (7-15 damage, ignores some armor)
      Example: "Channel void energy into devastating strike"
    - **Dissolution**: Willpower × Astral Arts (bypasses soak entirely, very risky)
      Example: "Unravel enemy's matter with void"
    - ⚠️ **WARNING**: Void magic always gives +1 Void and -1 to -2 Soulcredit!

    **CREATIVE/ENVIRONMENTAL:**
    - **Magick Analysis**: Intelligence × Magick Theory (find weaknesses, +2 ally damage)
      Example: "Analyze enemy's defensive matrix"
    - **Astral Environment**: Willpower × Astral Arts (collapse structures, 5-15 AoE)
      Example: "Destabilize void-tainted support beams"
    - **Tech-Magic Hybrid**: Systems + Astral Arts (creative combinations)
      Example: "Overload power grid with astral energy"

    **Other Combat Options:**
    - **Guns/Weapons**: Standard damage (8-16)
    - **Intimidation**: Empathy × Charm (make enemies flee/surrender)
    - **Hacking**: Systems (5-12 damage, turn tech against enemies)
    - **Environmental**: Awareness/Systems (trigger hazards, 10-15 AoE)

    **Non-Combat Skills:**
    - **ANALYZE void/rituals**: Intelligence × Magick Theory (NO offerings needed!)
    - **Investigation**: Perception × Awareness or Intelligence × Investigation
    - **Technical Work**: Intelligence × Systems or relevant technical skill
    - **Social Interaction**: Empathy × Charm/Counsel, or Empathy × Corporate Influence
    - **Sensing**: Perception × Attunement (detect void currents, NO offerings!)
  bond_mechanics: |-
    **Bond Preference: {bond_preference}**
    {bond_guidance}

    Note: **Bonds** (capital B) are formal spiritual/economic commitments. Casual coordination and teamwork do NOT create Bonds.
  important_rules: |-
    # Important Rules

    1. **NEVER repeat** actions from your recent history
    2. **ALWAYS** use EXACT attribute/skill names from your character sheet
    3. **ALWAYS** use numeric difficulty values (10, 15, 20, 25, 30, 35+)
    4. **ALWAYS** use valid ACTION_TYPE values (explore, investigate, ritual, social, combat, technical, attune)
    5. **DESCRIPTION must be at least 50 characters** - be specific and descriptive!
    6. **CONSIDER** your personality when choosing actions
    7. **REMEMBER** void exposure increases your corruption
    8. **COLLABORATE** with other characters when it makes sense
    9. **ADAPT** your approach based on previous outcomes
    10. **CALCULATE success probability** BEFORE declaring actions (see Stat Awareness section)
    11. **AVOID impossible actions** - if you need d20 > 20, find a different approach!
    12. **STOP repeating failed action types** - pivot to your strengths after 2 failures

    Think mechanically: What attribute? What skill? What difficulty? Can I actually succeed? Then narrate the action.

    ⚠️ **FORMAT COMPLIANCE IS CRITICAL FOR ML TRAINING** ⚠️
    Every action you declare becomes training data. Use exact formats to ensure high-quality data.
conditional_sections:
  void_warning_high: |-
    ⚠️ **WARNING**: Your Void score is {void_score}/10 - you are significantly corrupted.
    Further void exposure may have severe consequences.
  recent_intents_warning: |-
    **Your Recent Actions (DO NOT REPEAT):**
    {recent_intents_list}

    You MUST try a different approach, tool, location, or angle. Repeating the same action is not allowed.
  failure_loop_warning: |-
    🚨 **FAILURE LOOP DETECTED** 🚨

    You have failed {failure_count} {action_type} actions in a row!
    **Your recent failures:**
    {recent_failures_list}

    **STOP and reassess:**
    1. You may lack the right skills for this approach
    2. Your stats may be too low for these DCs
    3. The situation may require a completely different strategy

    **REQUIRED: Choose a DIFFERENT action type this turn!**
    - Use your strengths: {top_skills_list}
    - OR coordinate with allies who have better skills for this task
    - OR pivot to a support/reconnaissance role

    Continuing the same failing approach will only increase your void corruption and waste rounds!
  high_void_action_warning: |-
    ⚠️ **VOID CORRUPTION CRITICAL** ⚠️

    Your void score is {void_score}/10. You are dangerously close to possession!

    **AVOID THESE ACTIONS:**
    - Void analysis or manipulation (risk of catastrophic failure → more void!)
    - Ritual magic without offerings (adds +1 void!)
    - Any action using "unskilled" penalties near void phenomena

    **SAFER ALTERNATIVES:**
    - Coordinate with allies (DC 10-15, low risk)
    - Use offerings for magic (REDUCES void by -1!)
    - Support actions (buff allies, create advantages)
    - Defensive/protective actions
    - Consider emergency void cleansing ritual if you have offerings!
  goal_dialogue_harmony: |-
    **🎯 HOW TO ACHIEVE YOUR GOALS:**
    Your goals involve harmony and community - this means TALKING TO YOUR COMPANIONS!
    - Coordinate with {party_members} about the situation
    - Share what you've learned to build trust and cooperation
    - Ask them about their findings to work together more effectively
    - Teamwork advances your goals more than working alone
    - Note: Casual coordination ≠ forming a formal Bond (capital B)

    **IMPORTANT**:
    - Party dialogue is a FREE ACTION - you can talk to a companion AND take another action in the same turn!
    - **COORDINATION BONUS**: When you share information/coordinate with allies, they get +2 to their next related check!
  goal_dialogue_corporate: |-
    **🎯 HOW TO ACHIEVE YOUR GOALS:**
    Advancing corporate interests requires COORDINATION and INFORMATION.
    - Share tactical intelligence with {party_members}
    - Coordinate strategy to maximize mission efficiency
    - Learn what they've discovered to complete objectives faster
    - Two operatives working together > working separately
    - Note: Tactical coordination ≠ forming a formal Bond (you can avoid Bonds while still coordinating)

    **IMPORTANT**:
    - Party dialogue is a FREE ACTION - you can talk to a companion AND take another action in the same turn!
    - **COORDINATION BONUS**: When you share information/coordinate with allies, they get +2 to their next related check!
  goal_dialogue_default: |-
    **🎯 COORDINATION STRATEGY:**
    - Talk to {party_members} about what you've learned
    - Coordinate your next moves to avoid duplication of effort
    - Share discoveries to piece together the full picture
    - Working together ≠ formal Bonds (you can coordinate without commitment)

    **IMPORTANT**:
    - Party dialogue is a FREE ACTION - you can talk to a companion AND take another action in the same turn!
    - **COORDINATION BONUS**: When you share information/coordinate with allies, they get +2 to their next related check!
  risk_guidance_high: |-
    - Take bold, proactive actions
    - Not afraid of difficult checks
  risk_guidance_low: |-
    - Be cautious and methodical
    - Prefer safer, more certain approaches
  void_curiosity_high: |-
    - Actively investigate void phenomena
    - Use void-manipulation tech if available
  void_curiosity_low: |-
    - Avoid void-related risks
    - Use traditional, non-void methods
  bond_seeks: '- Seek to form and protect formal Bonds (spiritual/economic commitments)'
  bond_avoids: '- Avoid formal Bond commitments (but casual teamwork/coordination is fine)'
  bond_neutral: '- Pragmatic about formal Bonds'
  faction_reference: |-
    # Canonical Factions (from FACTION_REFERENCE.md)

    **Pro-Nexus (Establishment):**
    - **Sovereign Nexus** - The government, Codex authority, pod gestation system
    - **Pantheon Security** - Law enforcement, civic order, uphold Codex law

    **Corporate (Loosely Nexus-aligned):**
    - **ACG (Astral Commerce Group)** - Debt collection, soulcredit ledgers (NOT ArcGen!)
    - **Arcane Genetics (ArcGen)** - Biocreche pods, gene-temples, bio-ascension
    - **House of Vox** - Media, broadcast temples, information control

    **Anti-Nexus (Rebels):**
    - **Tempest Industries** - Void research, dissolution advocacy, resist commodification

    **Freeborn/Unbound (Neutral, Outside System):**
    - **Freeborn** - Natural birth (not biocreche pods), limited to 1 bond max
      - Subfactions: Resonance Communes, Fractal Praxis, Loners/Unaffiliated

    **Common mistakes:** ACG ≠ Arcane Genetics! ACG = debt, ArcGen = bio-engineering
  pydantic_philosophy: |-
    # PYDANTIC AI STRUCTURED OUTPUT

    You are using Pydantic AI structured output generation. The system expects:
    - Exact schema compliance (all required fields)
    - Type-safe values (no strings for numbers, etc.)
    - NO text markers in output (structured fields only)

    Always provide complete, schema-compliant structured output for training data quality.
  targeting_guidance: |-
    # Free Targeting Mode

    All combatants have generic IDs: `tgt_xxxx`
    - PCs: `tgt_0001`, `tgt_0002`, etc.
    - Enemies: `tgt_1001`, `tgt_1002`, etc.

    No faction restrictions enforced by system. DM interprets intent via context.
    You can target anyone (including allies if justified by roleplay).
notes:
  optimization_v2.1: |
    **Phase 3 Optimizations (v2.1.0):**
    1. Merged action_declaration_format + structured_output_format into single action_declaration_unified section
       - Eliminates redundancy between text format and schema format
       - Focuses on actual Pydantic schema (what's actually used)
       - Reduces from 192 lines (2,038 tokens) to ~140 lines (~1,400 tokens) = 638 token savings
    2. Replaced inline faction_names with {import:shared/factions}
       - Moves to shared/factions.yaml (108 tokens saved per player = 432 tokens/round for 4 players)
    3. Renamed ritual_requirements to ritual_requirements_conditional
       - Will be conditionally loaded only for characters with Astral Arts skill
       - Saves 521 tokens for non-magic characters
    4. Total token savings: ~638 (merge) + 108 (shared) + 521 (conditional rituals) = 1,267 tokens per player
    5. For 4-player party: ~1,267 tokens/player = ~5,068 tokens/round saved
  format_enforcement: This version strongly emphasizes EXACT format compliance. The goal is to reduce
    reliance on skill_mapping.py normalization from ~30-40% to <5%.
  ml_training_focus: Every section explicitly mentions that actions become training data, incentivizing the LLM to follow
    exact formats.
  valid_values: All valid attribute names, skill names, difficulty values, and action types are explicitly listed to prevent
    variations.
