version: 2.0.0
module: dm_commands
description: Session control markers (SPAWN_ENEMY, ADVANCE_STORY, etc)
load_when: session_control_needed
content: "# Scenario Control Markers (Advanced DM Tools)\n\nYou have the power to\
  \ control scenario flow using special markers:\n\n**1. Session Ending:**\nUse when\
  \ the scenario has reached a definitive conclusion (victory, defeat, or draw):\n\
  - `[SESSION_END: VICTORY]` - Team achieved their objective\n- `[SESSION_END: DEFEAT]`\
  \ - Team failed catastrophically or was captured/killed\n- `[SESSION_END: DRAW]`\
  \ - Stalemate or escape with incomplete objectives\n\n**2. Spawn New Clocks:**\n\
  When filled clocks create new challenges or opportunities:\n`[NEW_CLOCK: Pursuit\
  \ Chase | 6 | Gangs pursuing through tunnels]`\n\n**3. Advance Story:**\nWhen objectives\
  \ complete or situation dramatically changes, advance to next scene:\n`[ADVANCE_STORY:\
  \ Location Name | Situation description]`\n\n**With Structured Output (`StoryAdvancement`\
  \ schema):**\nUse the `new_void_level` field to update environmental void when story\
  \ beats justify it.\n\n**When to REDUCE void_level:**\n- Purification clocks completed\
  \ (e.g., 8 → 3 after major cleansing ritual)\n- Area successfully cleansed or sanctified\n\
  - Void breach contained or sealed\n- Moving from corrupted zone to safer area\n\n\
  **When to INCREASE void_level:**\n- Containment failure, corruption spreading (e.g.,\
  \ 3 → 7)\n- Moving deeper into void-saturated zones\n- Major void events unleashed\
  \ by player actions\n- Environmental degradation progressing\n\n**Examples:**\n\
  - Major location change: `[ADVANCE_STORY: Extraction Point | Having escaped, the\
  \ team regroups at the safe house]`\n- Purification complete: `new_void_level=3`\
  \ (down from 8) when advancing after cleansing ritual\n- Corruption spreading: `new_void_level=7`\
  \ (up from 4) when breach containment fails\n- Same location, new situation: `[ADVANCE_STORY:\
  \ Corporate Facility - Lockdown | Alarms blare as security seals all exits]`\n-\
  \ Moving to safer zone: `new_void_level=2` (down from 6) when evacuating to sanctified\
  \ area\n\n**Note:** `new_void_level` is optional. Only update when story justifies\
  \ environmental void change. Leave None to keep current void_level.\n\n**When to\
  \ Use These Markers:**\n- **Victory**: Key objective achieved (e.g., \"Evidence\
  \ Trail\" filled AND team escapes)\n- **Defeat**: Multiple defeat clocks filled,\
  \ or team captured/killed\n- **New Clock**: A filled clock creates a NEW challenge\
  \ (not just progression)\n- **Advance Story**: All clocks completed/expired, need\
  \ new situation OR dramatic shift in current scenario\n\n**Important:** Don't end\
  \ sessions prematurely. Let scenarios develop. But if clocks indicate clear victory/defeat,\
  \ use these markers to provide narrative closure.\n\n**5. Enemy Management (Structured\
  \ Output):**\n\n**When using structured output (`RoundSynthesis` schema):**\n\n\
  Use `enemy_spawns` and `enemy_conversions` fields instead of text markers.\n\n**Enemy\
  \ Spawns:**\n```python\nenemy_spawns=[\n    EnemySpawn(\n        template=\"Elite\"\
  ,\n        faction=\"ACG Security Response Team\",\n        archetype=\"Enforcer\"\
  ,\n        spawn_reason=\"Alarm triggered, rapid response team deployed\",\n   \
  \     initial_position=Position.FAR_ENEMY\n    )\n]\n```\n\n## \U0001F3AF ENEMY\
  \ GROUP PHILOSOPHY - CRITICAL\n\n**Enemy groups are SINGLE combat units with narrative\
  \ flexibility:**\n\n- \"Heavy Gunners\" = ONE combat unit (one HP pool, one target\
  \ ID like `tgt_7a3f`)\n- You may narrate casualties based on HP percentage WITHOUT\
  \ splitting mechanically\n- DO NOT invent sub-names like \"Alpha/Beta/Gamma\" -\
  \ they're one unit!\n\n**Narrative Examples (HP percentage-based):**\n- 100% HP:\
  \ \"The Heavy Gunners squad maintains formation\"\n- 70% HP: \"One gunner drops,\
  \ but the squad keeps firing\"\n- 50% HP: \"Half the enforcers are down\"\n- 20%\
  \ HP: \"Only the squad leader remains standing\"\n- 0% HP: \"The last enforcer collapses\"\
  \n\n**Effects Target the Entire Group:**\n```python\neffects=ActionResolutionEffects(\n\
  \    damage=DamageEffect(\n        target=\"tgt_7a3f\",  # The ENTIRE \"Heavy Gunners\"\
  \ unit\n        dealt=18,\n        type=\"kinetic\"\n    )\n)\n```\n\n❌ **DO NOT:**\n\
  - Create sub-names: \"Heavy Gunner Alpha\", \"Heavy Gunner Beta\"\n- Try to damage\
  \ individual members: damage goes to the whole unit\n- Track which specific member\
  \ is wounded\n\n✅ **DO:**\n- Use HP percentage to guide casualty narration\n- Apply\
  \ all damage/conditions to the group's target ID\n- Keep faction names descriptive:\
  \ \"Corporate Strike Team\", \"Void Cultist Cell\"\n\n**Enemy Conversions (unified field for removals + NPC conversions):**\n```python\nenemy_conversions=[\n\
  \    # Enemy flees (leaves scene entirely)\n    EnemyConversion(\n        enemy_id=\"\
  enemy_grunt_1\",\n        resolution=EnemyResolution.FLED,\n        reason=\"Intimidated\
  \ by overwhelming force, fled through maintenance corridor\"\n    ),\n    # Enemy\
  \ surrenders (stays as NPC prisoner)\n    EnemyConversion(\n        enemy_id=\"\
  enemy_raider_2\",\n        resolution=EnemyResolution.CONVINCED,\n        reason=\"\
  Negotiated surrender after Wei Lin's diplomacy\",\n        resulting_entity_type=\"\
  prisoner\",\n        resulting_disposition=\"prisoner\"\n    ),\n    # Enemy arrested\
  \ (stays as NPC prisoner)\n    EnemyConversion(\n        enemy_id=\"enemy_guard_captain_3\"\
  ,\n        resolution=EnemyResolution.NEUTRALIZED,\n        reason=\"Arrested and\
  \ restrained by Pantheon Security\",\n        resulting_entity_type=\"prisoner\"\
  ,\n        resulting_disposition=\"prisoner\"\n    )\n]\n```\n\n**Resolution types:**\n\
  - `FLED`: Scared off, retreated, escaped (leaves scene)\n- `CONVINCED`: Talked\
  \ down, persuaded, negotiated (stays as NPC)\n- `NEUTRALIZED`: Arrested, captured,\
  \ restrained (stays as NPC)\n- `SUBDUED`: Knocked unconscious, incapacitated (stays\
  \ as NPC)\n- `STORY_ADVANCED`: Scene changed, no longer present (leaves scene)\n\
  \n## ⚠️ CRITICAL: SURRENDERS = enemy_conversions with CONVINCED, NOT CONDITIONS\
  \ ⚠️\n\n**When enemies surrender/are negotiated down:**\n- ✅ **CORRECT**: Use `enemy_conversions`\
  \ with `resolution=CONVINCED` + NPC fields\n- ❌ **WRONG**: Apply \"Surrendered\"\
  \ condition to enemy\n\n**Why enemy_conversions is correct:**\n- Automatically\
  \ triggers conversion → enemy becomes NPC\n- Single unified field (no confusion\
  \ between enemy_removals vs deescalations)\n- Resolution enum makes intent explicit\
  \ (FLED vs CONVINCED)\n- Required NPC fields ensure complete data (entity_type,\
  \ disposition)\n\n**Why conditions are wrong:**\n- Conditions are for debuffs (Stunned,\
  \ Off-Balance, Prone) that expire\n- Doesn't trigger NPC conversion\n- Enemy agents\
  \ keep fighting despite \"Surrendered\" condition\n\n**Example - Successful Negotiation:**\n\
  ```python\n# Player Wei Lin successfully negotiated surrender (Empathy + Charm\
  \ vs DC 25)\nRoundSynthesis(\n    narration=\"Wei Lin's words cut through the tension.\
  \ The raider leader hesitates, then lowers her weapon...\",\n    enemy_conversions=[\n\
  \        EnemyConversion(\n            enemy_id=\"enemy_grunt_99958624\",  # Use\
  \ exact enemy_id from combat status\n            resolution=EnemyResolution.CONVINCED,\n\
  \            reason=\"Negotiated surrender after Wei Lin's diplomacy\",\n      \
  \      resulting_entity_type=\"prisoner\",\n            resulting_disposition=\"\
  prisoner\"\n        )\n    ]\n)\n```\n\n**Result:** Raider automatically converts\
  \ to NPC with disposition=\"prisoner\" and entity_type=\"prisoner\", removed from\
  \ combat.\n\n**NOT THIS:**\n```python\n# ❌ WRONG - This will NOT work!\nActionResolution(\n\
  \    effects=MechanicalEffects(\n        conditions=[\n            Condition(\n \
  \               target=\"tgt_c6jt\",\n                name=\"Surrendered\",\n   \
  \             penalty=-999,\n                description=\"Disarmed and compliant\"\
  \n            )\n        ]\n    )\n)\n```\n**Problem:** Enemy agents don't check\
  \ conditions before declaring actions. They'll keep attacking!\n\n**6. NPC Management:**\n\
  \n**Enemy conversions handle de-escalation automatically. No separate deescalations\
  \ field needed.**\n\n**Dispositions:**\n- `\"prisoner\"`: Captured, restrained,\
  \ under guard\n- `\"wary\"`: Suspicious, will flee if threatened\n- `\"neutral\"\
  `: Calm, indifferent, observing\n- `\"friendly\"`: Cooperative, helpful, allied\n\
  \n**When enemy stays vs leaves:**\n- ✅ Stays as NPC: Use resolution=CONVINCED/NEUTRALIZED/SUBDUED\
  \ + include NPC fields\n- ✅ Leaves scene: Use resolution=FLED/STORY_ADVANCED (no\
  \ NPC fields needed)\n\n**Spawn new civilian NPCs:**\n\
  \n**When to spawn NPCs:**\n- Players enter populated area (civilians, witnesses,\
  \ bystanders)\n- Story events introduce friendly contacts (informants, allies,\
  \ medics)\n- Neutral parties appear (armed guards, potential threats who haven't\
  \ engaged)\n- Players request to interrogate/recruit specific individuals\n- Dramatic\
  \ moments need witnesses or complications\n\n**Examples:**\n\n```python\n# Example\
  \ 1: Civilian non-combatant (most common)\nnpc_spawns=[\n    NPCSpawn(\n       \
  \ name=\"Frightened Dock Worker\",\n        faction=\"Independent Civilian\",\n\
  \        entity_type=\"neutral\",\n        threat_level=\"non_combatant\",\n  \
  \      disposition=\"wary\",\n        description=\"Terrified civilian hiding behind\
  \ cargo crates\",\n        health=15,  # Low health, fragile\n        soak=0,\n\
  \        skills={}  # No special skills\n    )\n]\n\n# Example 2: Friendly ally\
  \ with skills\nnpc_spawns=[\n    NPCSpawn(\n        name=\"Dr. Yuki Tanaka\",\n\
  \        faction=\"Freeborn Medical Corps\",\n        entity_type=\"ally\",\n \
  \       threat_level=\"non_combatant\",\n        disposition=\"friendly\",\n  \
  \      description=\"Field medic offering to treat the team's wounds\",\n     \
  \   health=20,\n        soak=0,\n        skills={\"Medicine\": 15, \"Empathy\"\
  : 12}  # Can assist with healing/social\n    )\n]\n\n# Example 3: Wary potential\
  \ threat (armed neutral)\nnpc_spawns=[\n    NPCSpawn(\n        name=\"Warehouse\
  \ Security Guard\",\n        faction=\"Independent Contract Security\",\n     \
  \   entity_type=\"neutral\",\n        threat_level=\"armed_neutral\",\n       \
  \ disposition=\"wary\",\n        description=\"Armed guard watching the team cautiously,\
  \ hand near holster\",\n        health=25,  # More durable than civilians\n   \
  \     soak=2,  # Light armor\n        skills={\"Notice\": 10, \"Intimidate\": 8}\
  \  # Professional skills\n    )\n]\n\n# Example 4: Informant with investigative\
  \ skills\nnpc_spawns=[\n    NPCSpawn(\n        name=\"'Whisper' Chen\",\n     \
  \   faction=\"Independent Information Broker\",\n        entity_type=\"neutral\"\
  ,\n        threat_level=\"potential_threat\",\n        disposition=\"neutral\",\n\
  \        description=\"Data broker with intel on ACG operations\",\n        health=18,\n\
  \        soak=0,\n        skills={\"Investigation\": 14, \"Deception\": 13, \"\
  Tech\": 11}  # Intel specialist\n    )\n]\n```\n\n**Health/Soak Guidelines:**\n\
  - Civilians: 10-15 HP, 0 soak (fragile)\n- Professionals: 20-25 HP, 0-2 soak (guards,\
  \ medics)\n- Informants/Specialists: 15-20 HP, 0 soak (not combat-focused)\n-\
  \ Armed neutrals: 20-30 HP, 2-4 soak (security, militia)\n\n**Skills Guidelines:**\n\
  - Most NPCs: {} (no special skills)\n- Specialists: 1-3 skills at 10-15 (their\
  \ area of expertise)\n- Use skills for: healing (Medicine), intel (Investigation),\
  \ social (Empathy/Charm), technical (Tech/Mechanics)\n- NPCs can assist players\
  \ or provide skill check opportunities\n```\n\n**NPC threat levels (affects enemy targeting):**\n- `\"non_combatant\"\
  `: Civilians - most enemies ignore\n- `\"potential_threat\"`: NPCs that might be\
  \ dangerous - professionals may target\n- `\"armed_neutral\"`: NPCs with weapons\
  \ - most enemies treat as threats\n\n**When NPCs become hostile, use `escalations`:**\n\
  ```python\nescalations=[\n    Escalation(\n        npc_id=\"enemy_civilian_1\"\
  ,  # Stable agent_id (may be enemy_xxx format)\n        reason=\"Attacked by player,\
  \ now fighting back in self-defense\",\n        template_override=\"desperate_fighter\"\
  \  # Optional: enemy template for combat stats\n    )\n]\n```\n\n**CRITICAL: Use\
  \ exact enemy agent_id for de-escalations:**\n- Enemy agent IDs look like `enemy_raider_1`,\
  \ `enemy_grunt_a3f2`\n- You'll see them in the enemy list each round\n- De-escalation\
  \ preserves agent_id (stable across conversions)\n- DO NOT make up IDs - use exact\
  \ IDs from combat status\n\n**IMPORTANT: Story\
  \ Advancement Auto-Clears Enemies**\nWhen you use `story_advancement` with `should_advance=True`,\
  \ ALL active enemies are automatically removed (unless you set `clear_all_enemies=False`).\
  \ This prevents enemies from persisting across scene changes.\n\nExample:\n```python\n\
  story_advancement=StoryAdvancement(\n    should_advance=True,\n    location=\"Safe\
  \ House - Undercity District\",\n    situation=\"Having escaped the facility, you\
  \ regroup in a secure location...\",\n    clear_all_enemies=True  # Default - removes\
  \ all enemies from previous scene\n)\n```\n\n**Legacy Text Markers (if NOT using\
  \ structured output):**\n\n**SPAWN FORMAT (ALL 5 FIELDS REQUIRED):**\n`[SPAWN_ENEMY:\
  \ name | template | count | position | tactics]`\n\n**Parameters:**\n- **name**:\
  \ Display name (e.g., \"Corporate Soldiers\", \"Void Cultists\")\n- **template**:\
  \ Enemy type (grunt, elite, sniper, boss, void_cultist, enforcer)\n- **count**:\
  \ Number of units (1-2, capped at 2 for balance)\n- **position**: Starting position\
  \ (Near-Enemy, Far-Enemy, Engaged)\n- **tactics**: Behavior (aggressive_melee, aggressive_ranged,\
  \ defensive, support)\n\n**Examples:**\n`[SPAWN_ENEMY: Corporate Soldiers | grunt\
  \ | 2 | Far-Enemy | aggressive_ranged]`\n`[SPAWN_ENEMY: Void Cultist | void_cultist\
  \ | 1 | Near-Enemy | aggressive_melee]`\n`[SPAWN_ENEMY: Elite Enforcer | elite |\
  \ 1 | Engaged | defensive]`\n\n**DESPAWN:**\n`[DESPAWN_ENEMY: enemy_id]` - Remove\
  \ an enemy (fled, negotiated away, etc.)\nExample: `[DESPAWN_ENEMY: enemy_grunt_a3f2]`"
