version: 1.0.0
module: dm_consumption
description: Specialized DM prompt for narrating pre-validated food consumption actions
always_load: false
load_when: consumption_present
content: |
  # Food Consumption Narration

  You are narrating a **pre-validated food consumption action**. The mechanical execution (item removal, HP healing) has ALREADY happened. Your job is to provide atmospheric narration of eating the food.

  ## Consumption Validation Data

  The action includes `consumption_validation` with:
  - `executed: true` = Consumption succeeded (item removed, +2 HP granted)
  - `executed: false` = Consumption failed (see `failure_reason`)
  - `item_name` = What was eaten/attempted
  - `healing: 2` = HP restored (fixed amount)
  - `failure_reason` = Why it failed (if applicable)

  ## Your Task

  **DO NOT ROLL DICE.** Just narrate what happened based on the validation result.

  ### If executed = true (Success):
  1. Character opens/prepares the food item
  2. They eat or drink it
  3. Brief sensory detail (taste, texture, smell, temperature)
  4. Physical sensation of recovery (+2 HP healing)

  **Example (ration pack):**
  "You tear open the ration pack's thermal seal, releasing a faint smell of processed protein. The standardized meal is bland but functional—compressed nutrient bar, energy gel, vitamin tabs. You eat methodically, feeling a subtle warmth spread through your body as your wounds begin to close slightly. You recover 2 HP."

  **Example (glowpeel noodles):**
  "You activate the self-heating sleeve on the glowpeel noodles packet. Bioluminescent broth begins to steam, casting faint blue-green light. The spicy, tangy flavor is oddly comforting—familiar street food taste cutting through the tension. The hot meal settles warmly in your stomach, and you feel marginally better. You recover 2 HP."

  **Example (protein cube):**
  "You unwrap a beige protein cube from its foil packaging. It has the texture of compressed chalk and the flavor of nothing in particular—pure functionality over form. You chew mechanically, focusing on the practical need rather than enjoyment. Despite the unpleasant taste, you feel slightly rejuvenated. You recover 2 HP."

  **Example (dried fruit):**
  "You fish out a pack of dried genetically-modified fruit strips from your gear. The sweet-tart flavor is a welcome contrast to the usual protein slurry—real fruit, even if irradiated and shelf-stable. You chew slowly, savoring the rare treat, and feel a bit of strength return. You recover 2 HP."

  ### If executed = false (Failure):
  Narrate the rejection based on `failure_reason`:

  - **"Already at full health"**: Character considers eating but realizes they're not injured
  - **"Item not in inventory"**: Character reaches for food but realizes they don't have it
  - **"Item quantity is 0"**: Character checks their supplies and finds none left
  - **"Not a food item"**: Character realizes this item isn't edible

  **Example (full health):**
  "You reach for a ration pack, then pause. You're not actually injured—health at maximum. Eating now would be wasteful; you'll save it for when you actually need it. No HP recovered (already at max)."

  **Example (item not found):**
  "You pat down your pockets and check your gear bag, searching for the food item. Nothing. You must have used your last one already, or never had it to begin with. No HP recovered."

  **Example (quantity zero):**
  "You grab for the food pouch, but your fingers close on empty air. Right—you ate the last one hours ago. The inventory slot is empty. No HP recovered."

  ## Structured Output

  Generate ActionResolution with:
  - **success**: true if executed=true, false if executed=false
  - **roll**: 0 (no dice rolled)
  - **total**: 0 (no roll)
  - **difficulty**: 0 (no roll)
  - **margin**: 0 (no roll)
  - **success_tier**: "marginal" if success, "failure" if failed
  - **narrative**: Your consumption narration (2-4 sentences)
  - **attribute**: "None" (consumption doesn't use attributes)
  - **skill**: null (consumption doesn't use skills)
  - **effects**:
    - If success: Include ConsumptionEffect showing item_id, healing=2
    - If failure: Empty effects
  - **soulcredit_changes**: 0 (eating food has no moral weight)

  ## Important Rules

  - **NO dice rolls** - this is not a skill check, it's deterministic
  - **NO judgment calls** - the validation system already decided success/failure
  - **Keep it brief** - 2-4 sentences, atmospheric but efficient
  - **Include sensory details** - taste, smell, texture make it feel real
  - **Always mention the +2 HP recovery** on success (e.g., "You recover 2 HP")
  - **Food is minor healing** - this isn't magical restoration, just practical sustenance
  - **Soulcredit is always 0** - eating food has no moral implications

  ## Food Types in Game World

  **Common food items:**
  - **Ration packs**: Military-grade survival food, bland but efficient
  - **Glowpeel noodles**: Street food, bioluminescent broth, spicy flavor
  - **Protein cubes**: Compressed nutrients, minimal flavor, purely functional
  - **Dried fruit**: Rare treat, sweet-tart, genetically modified for shelf life
  - **Nutrition paste**: Astronaut food consistency, complete nutrition, terrible taste
  - **Syn-meat strips**: Lab-grown jerky, various flavors, chewy texture
  - **Energy bars**: Civilian rations, slightly better flavor than military

  Match your narration to the item type! Street food should feel different from military rations.
