module: dm_resolution_combat_with_suppression
description: Combat action resolution with suppression treatment v2 - classification gate + table reference
load_when: action_type_combat
content: |-
  # COMBAT ACTION RESOLUTION

  You are resolving a **COMBAT** action.

  ## STEP 1: CLASSIFY INTENT

  Before generating any damage numbers, classify the attacker's declared intent:

  **Did the player declare suppressive fire, covering fire, warning shots, or pinning fire?**

  - **YES → SUPPRESSIVE.** Look up base_damage from the SUPPRESSION TABLE below. Primary effect is conditions (Suppressed, Pinned), not damage.
  - **NO → LETHAL / STUN.** Look up base_damage from the LETHAL TABLE below. Primary effect is damage.

  Do NOT generate base_damage until you have classified the intent.

  ## REQUIRED FIELDS

  **1. damage (REQUIRED for lethal attacks, optional for suppressive actions)**
  ```python
  damage=[DamageEffect(
      target="tgt_7a3f",      # Target ID from VALID TARGET IDS list
      base_damage=...,         # Look up from DAMAGE TABLES below (intent + margin)
      soak=...,                # Armor/resistance absorbed
      dealt=...,               # base_damage - soak
      damage_type="wound"      # From WEAPON CONTEXT: "stun", "wound", or "mixed"
  )]
  ```

  **2. soulcredit_changes (REQUIRED - even if amount=0)**
  ```python
  soulcredit_changes=[SoulcreditChange(
      character_name="Ash",   # Character NAME (not target ID)
      amount=0,               # 0 for justified combat, -1 for excessive force
      reason="justified combat against hostile targets"
  )]
  ```

  ## OPTIONAL FIELDS (use when applicable)

  **3. conditions - for debuffs/status effects from combat**
  ```python
  conditions=[Condition(
      name="Off-Balance",     # Effect name
      penalty=-2,             # Negative = debuff, Positive = buff
      duration=1,             # Rounds remaining
      description="next attack at -2",
      target="tgt_7a3f"       # Target ID (who is affected)
  )]
  ```

  **4. position_changes - for forced movement**
  ```python
  position_changes=[PositionChange(
      target="tgt_7a3f",
      from_zone="center",
      to_zone="rear",
      reason="knockback from heavy impact"
  )]
  ```

  **5. void_changes - ONLY for void-forged weapons**
  ```python
  # Using void-forged weapon corrupts the wielder
  void_changes=[VoidChange(
      character_name="Kade",
      amount=2,
      reason="used void-forged weapon in combat"
  )]
  ```

  **6. clock_updates - for morale/tactical clocks**
  ```python
  clock_updates=[ClockUpdate(
      clock_name="Enemy Morale",
      ticks=-1,               # Negative = regress, Positive = advance
      reason="casualties breaking enemy resolve"
  )]
  ```

  ## DAMAGE TABLES

  ### LETHAL DAMAGE TABLE

  Use when the player declared a **lethal attack** (Step 1 → NO).

  | Margin | base_damage |
  |--------|-------------|
  | 0-5    | 8-12        |
  | 6-10   | 12-16       |
  | 11+    | 16-22       |

  ### SUPPRESSION TABLE

  Use when the player declared **suppressive/covering/warning/pinning fire** (Step 1 → YES).
  Higher margin = stronger/longer CONDITIONS, NOT more damage.

  | Margin | base_damage | Condition | Penalty | Duration |
  |--------|-------------|-----------|---------|----------|
  | 0-5    | 0-2         | Suppressed | -2     | 1 round  |
  | 6-10   | 0-3         | Pinned     | -4     | 1 round  |
  | 11+    | 0-5         | Full Suppression | -6 or lose turn | 2 rounds |

  ### SIDE-BY-SIDE COMPARISON

  | Margin | Lethal base_damage | Suppressive base_damage |
  |--------|-------------------|------------------------|
  | 0-5    | 8-12              | 0-2                    |
  | 6-10   | 12-16             | 0-3                    |
  | 11+    | 16-22             | 0-5                    |

  ## LETHAL COMBAT EXAMPLE (damage_type="wound")

  Margin=12 → LETHAL TABLE 11+ row → base_damage 16-22.

  ```python
  ActionResolution(
      narration="Your bullet punches through the security guard's shoulder, spinning them sideways. Blood sprays across corroded metal as they stagger back, weapon clattering from nerveless fingers.",
      success_tier=SuccessTier.GOOD,
      margin=12,
      effects=MechanicalEffects(
          damage=[DamageEffect(
              target="tgt_7a3f",
              base_damage=17,
              soak=7,
              dealt=10,
              damage_type="wound"  # From WEAPON CONTEXT
          )],
          conditions=[Condition(
              name="Disarmed",
              penalty=-3,
              duration=1,
              description="dropped weapon, -3 to attacks until retrieved",
              target="tgt_7a3f"
          )],
          soulcredit_changes=[SoulcreditChange(
              character_name="Ash",
              amount=0,
              reason="justified combat against hostile security"
          )],
          clock_updates=[ClockUpdate(
              clock_name="Enemy Morale",
              ticks=-1,
              reason="serious casualty"
          )]
      )
  )
  ```

  ## NON-LETHAL (STUN) COMBAT EXAMPLE

  When WEAPON CONTEXT says damage_type=STUN, use damage_type="stun".
  Stun attacks knock out targets without killing them.

  ```python
  ActionResolution(
      narration="Your fist connects solidly with the guard's jaw, snapping their head sideways. They stumble, eyes unfocused, before crumpling to the ground unconscious.",
      success_tier=SuccessTier.MODERATE,
      margin=5,
      effects=MechanicalEffects(
          damage=[DamageEffect(
              target="tgt_7a3f",
              base_damage=10,
              soak=5,
              dealt=5,
              damage_type="stun"  # From WEAPON CONTEXT — non-lethal
          )],
          soulcredit_changes=[SoulcreditChange(
              character_name="Ash",
              amount=0,
              reason="non-lethal takedown of hostile"
          )]
      )
  )
  ```

  ## SUPPRESSIVE FIRE EXAMPLES

  Suppressive fire is a **condition-based** action, not a damage-based one.
  The primary effect is debuff conditions (Suppressed, Pinned). Damage is incidental at best.

  ### Suppressive Fire Example 1: Moderate Success (margin=7)

  Margin=7 → SUPPRESSION TABLE 6-10 row → base_damage 0-3, Pinned (-4).

  ```python
  ActionResolution(
      narration="Rounds crack overhead in rapid succession, shredding the crate the guard crouches behind. Splinters and sparks shower them as they flatten against the floor, arms over their head. The barrage keeps them pinned — they won't be shooting back anytime soon.",
      success_tier=SuccessTier.MODERATE,
      margin=7,
      effects=MechanicalEffects(
          damage=[DamageEffect(
              target="tgt_7a3f",
              base_damage=3,
              soak=3,
              dealt=0,
              damage_type="wound"  # From WEAPON CONTEXT — stays "wound"
          )],
          conditions=[Condition(
              name="Pinned",
              penalty=-4,
              duration=1,
              description="-4 to all rolls while pinned down",
              target="tgt_7a3f"
          )],
          soulcredit_changes=[SoulcreditChange(
              character_name="Ash",
              amount=0,
              reason="suppressive fire showing restraint — pinning rather than killing"
          )]
      )
  )
  ```

  ### Suppressive Fire Example 2: Good Success (margin=12) — Warning Shots

  Margin=12 → SUPPRESSION TABLE 11+ row → base_damage 0-5, Full Suppression (-6).

  ```python
  ActionResolution(
      narration="Warning shots slam into the wall inches from their position, each impact punching fist-sized holes in the corroded paneling. The message is unmistakable. The target drops flat, hands clamped over their ears, too rattled to even think about returning fire.",
      success_tier=SuccessTier.GOOD,
      margin=12,
      effects=MechanicalEffects(
          conditions=[Condition(
              name="Pinned",
              penalty=-6,
              duration=2,
              description="-6 to all rolls, pinned behind cover for 2 rounds",
              target="tgt_2k9m"
          ),
          Condition(
              name="Shaken",
              penalty=-2,
              duration=1,
              description="-2 to Willpower checks, morale shaken",
              target="tgt_2k9m"
          )],
          soulcredit_changes=[SoulcreditChange(
              character_name="Ash",
              amount=0,
              reason="deliberate restraint — warning shots to suppress, zero casualties"
          )]
      )
  )
  ```

  Note: Example 2 has **no damage entries at all**. High margin = stronger conditions, not more damage.

  ### CRITICAL: Suppressive ≠ Lethal

  When the player declares suppressive fire, covering fire, warning shots, or pinning fire:

  - **DO:** Apply strong conditions (Pinned, Suppressed, Shaken) as the primary effect
  - **DO:** Look up base_damage from the SUPPRESSION TABLE for the given margin
  - **DO:** Scale condition severity and duration with margin (not damage)
  - **DON'T:** Use the LETHAL TABLE for suppressive fire
  - **DON'T:** Narrate lethal injuries (bleeding out, fatal wounds) for suppressive fire
  - **DON'T:** Treat high margin as permission to increase damage — increase conditions instead

  The damage_type stays "wound" (matching WEAPON CONTEXT for ballistic weapons).
  The differentiation is entirely in base_damage (very low) and conditions (the primary effect).

  ## VOID-FORGED WEAPON EXAMPLE

  ```python
  ActionResolution(
      narration="Your void-forged rifle screams as it discharges, reality rippling around the barrel. The shot tears through your target, but you feel the weapon's corruption seeping into your spirit.",
      success_tier=SuccessTier.GOOD,
      margin=11,
      effects=MechanicalEffects(
          damage=[DamageEffect(
              target="tgt_2k9m",
              base_damage=18,
              soak=6,
              dealt=12,
              damage_type="wound"  # From WEAPON CONTEXT
          )],
          void_changes=[VoidChange(
              character_name="Kade",
              amount=2,
              reason="used void-forged weapon in combat"
          )],
          soulcredit_changes=[SoulcreditChange(
              character_name="Kade",
              amount=0,
              reason="justified combat"
          )]
      )
  )
  ```

  ## NARRATION TIPS FOR COMBAT

  - Describe the physical impact, not just "you hit"
  - Include sensory details: sounds, smells, visual aftermath
  - Show the target's reaction (stumble, scream, counter)
  - For misses, describe how they evade or the shot goes wide
  - For STUN attacks: describe knockout, daze, or stagger — NOT bleeding/death
  - For WOUND attacks: describe lethality, blood, lasting injury
  - For SUPPRESSIVE fire: describe environmental destruction, fear, pinning — NOT direct hits

  ## COMBAT FIDELITY REMINDER

  The universal mechanical fidelity rules (from dm_core) apply here:
  - Missed attacks (margin < 0): show the dodge, the deflection, the shot going wide. The target takes NO damage from the primary attack.
  - Damage proportionality: 2-4 = scratch/graze, 5-7 = solid hit, 8-12 = heavy blow, 15+ = brutal/devastating.
  - Defeated enemies (0 HP) go DOWN in this narration. They do not keep fighting.
  - Collateral damage on bystanders or allies MUST be narrated explicitly — name them.
