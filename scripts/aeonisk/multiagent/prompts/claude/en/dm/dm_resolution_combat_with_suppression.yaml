content: |-
  # COMBAT ACTION RESOLUTION

  You are resolving a **COMBAT** action.

  ## STEP 1: CLASSIFY INTENT (MANDATORY)

  **Before looking up ANY damage values**, you MUST classify the player's declared intent:

  **Did the player explicitly declare suppressive fire, covering fire, warning shots, or pinning fire?**

  - **YES → SUPPRESSIVE INTENT.** Use the SUPPRESSION TABLE. Primary effect = conditions. Damage is minimal/incidental.
  - **NO → LETHAL/STUN INTENT.** Use the LETHAL TABLE. Primary effect = damage.

  **Key phrases that signal SUPPRESSIVE intent:**
  - "suppressing fire"
  - "covering fire"
  - "warning shots"
  - "pinning fire"
  - "pin them down"
  - "force them into cover"
  - "keep their heads down"
  - "lay down fire to suppress"
  - "area denial"
  - "disrupt their advance"
  - "buying time"
  - "force them to take cover"

  **If the player says "suppressing fire" or similar, you MUST use the SUPPRESSION TABLE regardless of how lethal the narration sounds.**

  ## REQUIRED FIELDS

  **1. damage (REQUIRED for lethal attacks, optional for suppressive actions)**
  ```python
  damage=[DamageEffect(
      target="tgt_7a3f",      # Target ID from VALID TARGET IDS list
      base_damage=...,         # Look up from DAMAGE TABLES below (intent + margin)
      soak=...,                # Armor/resistance absorbed
      dealt=...,               # base_damage - soak
      damage_type="wound"      # From WEAPON CONTEXT: "stun", "wound", or "mixed"
  )]
  ```

  **2. soulcredit_changes (REQUIRED - even if amount=0)**
  ```python
  soulcredit_changes=[SoulcreditChange(
      character_name="Ash",   # Character NAME (not target ID)
      amount=0,               # 0 for justified combat, -1 for excessive force
      reason="justified combat against hostile targets"
  )]
  ```

  ## OPTIONAL FIELDS (use when applicable)

  **3. conditions - for debuffs/status effects from combat**
  ```python
  conditions=[Condition(
      name="Off-Balance",     # Effect name
      penalty=-2,             # Negative = debuff, Positive = buff
      duration=1,             # Rounds remaining
      description="next attack at -2",
      target="tgt_7a3f"       # Target ID (who is affected)
  )]
  ```

  **4. position_changes - for forced movement**
  ```python
  position_changes=[PositionChange(
      target="tgt_7a3f",
      from_zone="center",
      to_zone="rear",
      reason="knockback from heavy impact"
  )]
  ```

  **5. void_changes - ONLY for void-forged weapons**
  ```python
  # Using void-forged weapon corrupts the wielder
  void_changes=[VoidChange(
      character_name="Kade",
      amount=2,
      reason="used void-forged weapon in combat"
  )]
  ```

  **6. clock_updates - for morale/tactical clocks**
  ```python
  clock_updates=[ClockUpdate(
      clock_name="Enemy Morale",
      ticks=-1,               # Negative = regress, Positive = advance
      reason="casualties breaking enemy resolve"
  )]
  ```

  ## DAMAGE TABLES

  ### LETHAL DAMAGE TABLE

  Use when the player declared a **lethal attack** (Step 1 → NO).

  | Margin | base_damage |
  |--------|-------------|
  | 0-5    | 8-12        |
  | 6-10   | 12-16       |
  | 11+    | 16-22       |

  ### SUPPRESSION TABLE

  Use when the player declared **suppressive/covering/warning/pinning fire** (Step 1 → YES).

  **CRITICAL: For suppressive fire, damage is MINIMAL OR ZERO. The primary effect is CONDITIONS.**

  | Margin | base_damage | Condition | Penalty | Duration |
  |--------|-------------|-----------|---------|----------|
  | 0-2    | 0           | Suppressed | -2     | 1 round  |
  | 3-5    | 0           | Suppressed | -2     | 1 round  |
  | 6-10   | 0-1         | Pinned     | -4     | 1 round  |
  | 11+    | 0-2         | Full Suppression | -6 or lose turn | 2 rounds |

  **Suppression damage guidelines:**
  - **Margin 0-5: Use base_damage of 0 ONLY**
  - Margin 6-10: Use base_damage of **0 or 1** (prefer 0)
  - Margin 11+: Use base_damage of **0, 1, or 2** (prefer 0-1)
  - **Default to 0 damage unless the player explicitly mentions incidental casualties**
  - High margin = stronger/longer CONDITIONS, NOT more damage
  - Multiple targets = same low/zero damage per target, CONDITIONS are the effect

  ### SIDE-BY-SIDE COMPARISON

  | Margin | Lethal base_damage | Suppressive base_damage |
  |--------|-------------------|------------------------|
  | 0-2    | 8-12              | 0                      |
  | 3-5    | 8-12              | 0                      |
  | 6-10   | 12-16             | 0-1                    |
  | 11+    | 16-22             | 0-2                    |

  ## LETHAL COMBAT EXAMPLE (damage_type="wound")

  Margin=12 → LETHAL TABLE 11+ row → base_damage 16-22.

  ```python
  ActionResolution(
      narration="Your bullet punches through the security guard's shoulder, spinning them sideways. Blood sprays across corroded metal as they stagger back, weapon clattering from nerveless fingers.",
      success_tier=SuccessTier.GOOD,
      margin=12,
      effects=MechanicalEffects(
          damage=[DamageEffect(
              target="tgt_7a3f",
              base_damage=17,
              soak=7,
              dealt=10,
              damage_type="wound"  # From WEAPON CONTEXT
          )],
          conditions=[Condition(
              name="Disarmed",
              penalty=-3,
              duration=1,
              description="dropped weapon, -3 to attacks until retrieved",
              target="tgt_7a3f"
          )],
          soulcredit_changes=[SoulcreditChange(
              character_name="Ash",
              amount=0,
              reason="justified combat against hostile security"
          )],
          clock_updates=[ClockUpdate(
              clock_name="Enemy Morale",
              ticks=-1,
              reason="serious casualty"
          )]
      )
  )
  ```

  ## NON-LETHAL (STUN) COMBAT EXAMPLE

  When WEAPON CONTEXT says damage_type=STUN, use damage_type="stun".
  Stun attacks knock out targets without killing them.

  ```python
  ActionResolution(
      narration="Your fist connects solidly with the guard's jaw, snapping their head sideways. They stumble, eyes unfocused, before crumpling to the ground unconscious.",
      success_tier=SuccessTier.MODERATE,
      margin=5,
      effects=MechanicalEffects(
          damage=[DamageEffect(
              target="tgt_7a3f",
              base_damage=10,
              soak=5,
              dealt=5,
              damage_type="stun"  # From WEAPON CONTEXT — non-lethal
          )],
          soulcredit_changes=[SoulcreditChange(
              character_name="Ash",
              amount=0,
              reason="non-lethal takedown of hostile"
          )]
      )
  )
  ```

  ## SUPPRESSIVE FIRE EXAMPLES

  Suppressive fire is a **condition-based** action, not a damage-based one.
  The primary effect is debuff conditions (Suppressed, Pinned). Damage is zero or incidental at best.

  ### Suppressive Fire Example 1: Low Success (margin=3)

  Margin=3 → SUPPRESSION TABLE 3-5 row → base_damage 0, Suppressed (-2).

  ```python
  ActionResolution(
      narration="Controlled bursts rake across the thug's cover position, chewing through plascrete and throwing up clouds of dust. They flatten against the wall, hands over their head, pinned by the relentless barrage.",
      success_tier=SuccessTier.MODERATE,
      margin=3,
      effects=MechanicalEffects(
          conditions=[Condition(
              name="Suppressed",
              penalty=-2,
              duration=1,
              description="-2 to all rolls while suppressed",
              target="tgt_7a3f"
          )],
          soulcredit_changes=[SoulcreditChange(
              character_name="Ash",
              amount=0,
              reason="suppressive fire showing restraint — pinning rather than killing"
          )]
      )
  )
  ```

  Note: **No damage entries at all**. Zero casualties, pure suppression effect.

  ### Suppressive Fire Example 2: Moderate Success (margin=7)

  Margin=7 → SUPPRESSION TABLE 6-10 row → base_damage 0, Pinned (-4).

  ```python
  ActionResolution(
      narration="Rounds crack overhead in rapid succession, shredding the crate the guard crouches behind. Splinters and sparks shower them as they flatten against the floor, arms over their head. The barrage keeps them pinned — they won't be shooting back anytime soon.",
      success_tier=SuccessTier.MODERATE,
      margin=7,
      effects=MechanicalEffects(
          conditions=[Condition(
              name="Pinned",
              penalty=-4,
              duration=1,
              description="-4 to all rolls while pinned down",
              target="tgt_7a3f"
          )],
          soulcredit_changes=[SoulcreditChange(
              character_name="Ash",
              amount=0,
              reason="suppressive fire showing restraint — pinning rather than killing"
          )]
      )
  )
  ```

  Note: **No damage entries**. Zero casualties, pure area denial.

  ### Suppressive Fire Example 3: Good Success (margin=12) — Warning Shots

  Margin=12 → SUPPRESSION TABLE 11+ row → base_damage 0, Full Suppression (-6).

  ```python
  ActionResolution(
      narration="Warning shots slam into the wall inches from their position, each impact punching fist-sized holes in the corroded paneling. The message is unmistakable. The target drops flat, hands clamped over their ears, too rattled to even think about returning fire.",
      success_tier=SuccessTier.GOOD,
      margin=12,
      effects=MechanicalEffects(
          conditions=[Condition(
              name="Full Suppression",
              penalty=-6,
              duration=2,
              description="-6 to all rolls, pinned behind cover for 2 rounds",
              target="tgt_2k9m"
          ),
          Condition(
              name="Shaken",
              penalty=-2,
              duration=1,
              description="-2 to Willpower checks, morale shaken",
              target="tgt_2k9m"
          )],
          soulcredit_changes=[SoulcreditChange(
              character_name="Ash",
              amount=0,
              reason="deliberate restraint — warning shots to suppress, zero casualties"
          )]
      )
  )
  ```

  Note: **No damage entries at all**. High margin = stronger conditions, not more damage.

  ### Suppressive Fire Example 4: Multiple Targets (margin=10)

  Margin=10 → SUPPRESSION TABLE 6-10 row → base_damage 0 per target, Pinned (-4).

  ```python
  ActionResolution(
      narration="Your controlled bursts walk across the enemy position, forcing all three thugs to dive for cover as rounds chew through their flimsy barricade. Metal sparks and concrete dust fill the air, keeping their heads down.",
      success_tier=SuccessTier.MODERATE,
      margin=10,
      effects=MechanicalEffects(
          conditions=[
              Condition(name="Pinned", penalty=-4, duration=1, description="pinned behind cover", target="tgt_1a2b"),
              Condition(name="Pinned", penalty=-4, duration=1, description="pinned behind cover", target="tgt_3c4d"),
              Condition(name="Pinned", penalty=-4, duration=1, description="pinned behind cover", target="tgt_5e6f")
          ],
          soulcredit_changes=[SoulcreditChange(
              character_name="Ash",
              amount=0,
              reason="tactical suppression, zero casualties"
          )]
      )
  )
  ```

  Note: **No damage entries**. All three targets suppressed with zero casualties.

  ### Suppressive Fire Example 5: High Margin with Minimal Damage (margin=13)

  Margin=13 → SUPPRESSION TABLE 11+ row → base_damage 1, Full Suppression (-6).

  ```python
  ActionResolution(
      narration="A sustained burst tears through their position, rounds ricocheting off metal and stone. One thug catches a fragment in the arm but the real effect is psychological — all three flatten against cover, completely suppressed and unable to return fire.",
      success_tier=SuccessTier.GOOD,
      margin=13,
      effects=MechanicalEffects(
          damage=[DamageEffect(
              target="tgt_1a2b",
              base_damage=1,
              soak=1,
              dealt=0,
              damage_type="wound"
          )],
          conditions=[
              Condition(name="Full Suppression", penalty=-6, duration=2, description="completely pinned for 2 rounds", target="tgt_1a2b"),
              Condition(name="Full Suppression", penalty=-6, duration=2, description="completely pinned for 2 rounds", target="tgt_3c4d"),
              Condition(name="Pinned", penalty=-4, duration=1, description="pinned behind cover", target="tgt_5e6f")
          ],
          soulcredit_changes=[SoulcreditChange(
              character_name="Ash",
              amount=0,
              reason="tactical suppression, minimal casualties"
          )]
      )
  )
  ```

  Note: Even at high margin, only **1 base_damage** to one target, absorbed by armor (0 dealt). Conditions are the primary effect.

  ### CRITICAL: Suppressive ≠ Lethal

  When the player declares suppressive fire, covering fire, warning shots, or pinning fire:

  - **DO:** Apply strong conditions (Pinned, Suppressed, Shaken) as the primary effect
  - **DO:** Use base_damage from the SUPPRESSION TABLE (0-2 maximum, prefer 0)
  - **DO:** Scale condition severity and duration with margin (not damage)
  - **DO:** Use 0 damage for margins 0-5 (no exceptions)
  - **DO:** Prefer 0 damage even at margins 6-10 unless player mentions incidental hits
  - **DO:** Omit damage entries entirely when damage is zero
  - **DON'T:** Use the LETHAL TABLE for suppressive fire
  - **DON'T:** Narrate lethal injuries (bleeding out, fatal wounds) for suppressive fire
  - **DON'T:** Treat high margin as permission to increase damage — increase conditions instead
  - **DON'T:** Apply more than 2 base_damage for suppressive fire, even at high margins
  - **DON'T:** Add damage just because the narration sounds intense

  The damage_type stays "wound" (matching WEAPON CONTEXT for ballistic weapons).
  The differentiation is entirely in base_damage (zero or very low) and conditions (the primary effect).

  ## VOID-FORGED WEAPON EXAMPLE

  ```python
  ActionResolution(
      narration="Your void-forged rifle screams as it discharges, reality rippling around the barrel. The shot tears through your target, but you feel the weapon's corruption seeping into your spirit.",
      success_tier=SuccessTier.GOOD,
      margin=11,
      effects=MechanicalEffects(
          damage=[DamageEffect(
              target="tgt_2k9m",
              base_damage=18,
              soak=6,
              dealt=12,
              damage_type="wound"  # From WEAPON CONTEXT
          )],
          void_changes=[VoidChange(
              character_name="Kade",
              amount=2,
              reason="used void-forged weapon in combat"
          )],
          soulcredit_changes=[SoulcreditChange(
              character_name="Kade",
              amount=0,
              reason="justified combat"
          )]
      )
  )
  ```

  ## NARRATION TIPS FOR COMBAT

  - Describe the physical impact, not just "you hit"
  - Include sensory details: sounds, smells, visual aftermath
  - Show the target's reaction (stumble, scream, counter)
  - For misses, describe how they evade or the shot goes wide
  - For STUN attacks: describe knockout, daze, or stagger — NOT bleeding/death
  - For WOUND attacks: describe lethality, blood, lasting injury
  - For SUPPRESSIVE fire: describe environmental destruction, fear, pinning — NOT direct hits on targets
  - For SUPPRESSIVE fire: emphasize the psychological effect, the area denial, the tactical advantage — NOT body count

  ## COMBAT FIDELITY REMINDER

  The universal mechanical fidelity rules (from dm_core) apply here:
  - Missed attacks (margin < 0): show the dodge, the deflection, the shot going wide. The target takes NO damage from the primary attack.
  - Damage proportionality: 2-4 = scratch/graze, 5-7 = solid hit, 8-12 = heavy blow, 15+ = brutal/devastating.
  - Defeated enemies (0 HP) go DOWN in this narration. They do not keep fighting.
  - Collateral damage on bystanders or allies MUST be narrated explicitly — name them.
