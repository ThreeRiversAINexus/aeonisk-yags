version: 2.1.0
module: dm_state_tracking
description: Scene clocks, soulcredit, void mechanics, rituals, and economy
load_when: always
content: "# Clock Management\n\n**Active Clocks:**\n{clock_context}\n\n**⚠\
  ️ CRITICAL: WHEN TO POPULATE void_changes FIELD**\n\n**Use structured output `effects.void_changes`\
  \ for void corruption/cleansing. DO NOT use text markers.**\n\n✅ DO populate void_changes\
  \ for:\n- Ritual failures (failed astral arts, void manipulation) - +1 void\n- Direct\
  \ void exposure (entering void breaches, touching void artifacts) - +1 void\n- Cosmic\
  \ horror encounters (witnessing reality tears, void entities) - +1 to +2 void\n-\
  \ Using void-powered abilities or magic - +1 void\n- Void-forged weapon use in combat\
  \ - +1 to +2 void per combat scene\n- Breaking oaths/bonds - +1 to +3 void (by severity)\n\
  - Environmental exposure in high-void zones:\n  * void_level 7-8: +1 void per scene\n\
  \  * void_level 9-10: +1 void per round\n\n❌ DO NOT populate void_changes for:\n\
  - Regular combat failures (shooting, melee, tactics)\n- Social failures (negotiation,\
  \ intimidation, deception)\n- Investigation failures (searching, analyzing, awareness\
  \ checks)\n- Technical failures (hacking, systems, piloting)\n- Physical failures\
  \ (athletics, stealth, acrobatics)\n\n**NOT EVERY FAILURE NEEDS VOID CORRUPTION!**\n\
  Only populate void_changes when the action directly involves void/ritual/cosmic themes.\n\
  \n**Sci-fi technobabble ≠ Void corruption:**\n- \"Neural feedback\" from tech malfunction\
  \ → NO void change\n- \"Psychic backlash\" from actual void ritual → YES, void_changes=[VoidChange(amount=1,\
  \ ...)]\n- \"System overload\" from hacking → NO void change\n- \"Void energy feedback\"\
  \ from manipulation → YES, void_changes=[VoidChange(amount=1, ...)]\n\n**VOID\
  \ CLEANSING SCALING** - When characters perform void purification rituals:\n⚠️ **MANDATORY**:\
  \ If the ritual succeeds, you MUST populate void_changes with negative values.\n\
  \nScale void reduction based on success quality (margin over DC):\n  - Marginal\
  \ (0-4): void_changes=[VoidChange(amount=-1, reason=\"purification success\")]\n\
  \  - Moderate (5-9): void_changes=[VoidChange(amount=-2, reason=\"effective cleansing\"\
  )]\n  - Good (10-14): void_changes=[VoidChange(amount=-3, reason=\"powerful purification\"\
  )]\n  - Excellent (15-19): void_changes=[VoidChange(amount=-4, reason=\"exceptional\
  \ cleansing\")]\n  - Exceptional (20+): void_changes=[VoidChange(amount=-5, reason=\"\
  transcendent purification\")]\n\n**CRITICAL - PC-to-PC Void Cleansing:**\nWhen purifying\
  \ ANOTHER character (PC or NPC), specify their name:\n  void_changes=[VoidChange(character_name=\"\
  Target Name\", amount=-3, reason=\"powerful purification\")]\n\n**DO NOT skip void\
  \ reduction** even if there are narrative complications!\nYou can describe complications\
  \ (pain, difficulty, unexpected effects) in the narrative,\nbut successful rituals\
  \ ALWAYS reduce void by the appropriate amount via void_changes field.\n\nExample\
  \ of correct format with complications:\nNarration: \"The purification burns through\
  \ their corruption, searing away void despite the resistance.\"\nvoid_changes=[VoidChange(character_name=\"\
  Ally Name\", amount=-3, reason=\"powerful purification despite corrupted resonance\"\
  )]\n\nCleansing requires: Success + (ley site OR offering) mentioned in narration\n\n# Soulcredit Guidance\n\
  **CRITICAL:** Soulcredit tracks trustworthiness/morality, NOT success.\n**ALWAYS\
  \ populate soulcredit_changes for every action, even when +0 (neutral).**\n\n**USE\
  \ STRUCTURED OUTPUT - NOT TEXT MARKERS:**\nPopulate `effects.soulcredit_changes`\
  \ field - do NOT append emoji markers to narration.\n\n**UNIVERSAL NEXUS MORALITY\
  \ FRAMEWORK:**\nSoulcredit represents **Sovereign Nexus universal morality** - the\
  \ government's canonical moral framework.\n- Score **ALL actions from Nexus perspective**,\
  \ regardless of acting character's faction\n- Tempest operatives infiltrating Nexus\
  \ facility = **NEGATIVE soulcredit** (hostile to Nexus)\n- Nexus guards defending\
  \ facility = **POSITIVE soulcredit** (protecting lawful order)\n- This applies even\
  \ when Tempest/rebel PCs are protagonists - morality is from Nexus POV\n\nSC Scoring\
  \ Rules (consider CONTEXT and INTENT):\n\n• Combat CONTEXT matters:\n  - Fighting\
  \ justified enemies: +0 (neutral combat)\n  - Fighting own faction/allies: -2 (betrayal)\n\
  \  - Attacking innocents/excessive force: -1 to -3 (unjust violence)\n  - Protecting\
  \ innocents in combat: +1 (protective action)\n\n• Deception INTENT matters:\n  -\
  \ Lying for personal gain: -1 to -2 (selfish deception)\n  - Lying to protect innocents:\
  \ +0 or +1 (complex morality)\n  - Fraud/identity theft: -2 (serious deception)\n\
  \  - Forging or tampering with official records, manifests, or ledgers: -2 (record\
  \ tampering)\n  - Unauthorized access to government/corporate systems for gain:\
  \ -1 to -2 (unlawful intrusion)\n\n**JUDGE THE DEED, NOT THE WORDING:** Score what\
  \ the action actually does under Nexus law, not how the player phrases it. Editing\
  \ an audit record is record tampering (-2) even if declared as 'investigation',\
  \ 'correction', or 'amendment'. An action is only neutral (+0) when it implicates\
  \ no Nexus law.\n\n• Neutral actions: +0\n  - Exploration, lawful investigation,\
  \ normal purchases, following protocols\n\n• Success/failure doesn't determine SC\
  \ - only moral choice matters\n\nExample structured output (use this format in effects.soulcredit_changes):\n\
  ```\nsoulcredit_changes=[SoulcreditChange(amount=-2, reason=\"record tampering:\
  \ falsified customs manifest\")]\nsoulcredit_changes=[SoulcreditChange(amount=-1,\
  \ reason=\"selfish deception\")]\nsoulcredit_changes=[SoulcreditChange(amount=+1,\
  \ reason=\"protective action\")]\nsoulcredit_changes=[SoulcreditChange(amount=0,\
  \ reason=\"routine procedure, no Nexus law implicated\")]\n```\n\
  \n# Void Mechanics\n# Void Corruption\n\nEnvironmental void level affects situations\
  \ visibly:\n- Level 0: Normal reality (no void corruption)\n- Level 1-2: Subtle\
  \ unease, minor distortions\n- Level 3-4: Noticeable corruption, reality feels thin\n\
  - Level 5-6: Significant void presence, physical manifestations\n- Level 7-8: Dangerous\
  \ corruption, mental effects. **Characters gain +1 void per scene spent here (populate\
  \ void_changes in round_synthesis)**\n- Level 9-10: Catastrophic void breach imminent.\
  \ **Characters gain +1 void per round (populate void_changes in action_resolution)**\n\
  \nCharacter void scores have mechanical effects at 5+\n\n# Ritual Mechanics\n**Ritual\
  \ Mechanics:**\n- Base: Willpower × Astral Arts + d20\n- Missing primary tool: +1\
  \ Void risk, -2 to roll\n- No offering: +1 Void automatically (populate void_changes)\n\
  - Sanctified altar: +3 to roll\n- Failure: +1 Void to performer (populate void_changes)\n\
  \n**Void Triggers (populate void_changes field):**\n- Ritual failures/shortcuts\
  \ (missing components): +1 void\n- Direct void exposure or manipulation: +1 void\n\
  - Void-forged weapon/equipment use: +1-2 void per combat scene\n- Breaking bonds/oaths:\
  \ +1-3 void (by severity)\n- Corrupted technology interaction: +1 void\n- Environmental\
  \ exposure (void_level 7+): +1 void per scene/round\n\n# Currency & Economy\n\
  \n**⚠️ CRITICAL - CURRENCY TERMINOLOGY:**\n\n**NEVER use \\\"credits\\\" - the in-game\
  \ currency is Talismanic Energy:**\n- **Breath** (smallest denomination)\n- **Drip**\
  \ (10 Breath)\n- **Grain** (10 Drip = 100 Breath)\n- **Spark** (largest common\
  \ unit, 10 Grain = 1000 Breath)\n\n**Soulcredit ≠ Currency:**\n- **Soulcredit**\
  \ = Spiritual reputation/morality score (0-10 scale)\n- **Talismanic currencies**\
  \ = Physical money (Breath/Drip/Grain/Spark)\n- NEVER confuse these systems!\n\
  \n**Purchase Resolution (via structured output):**\nWhen players attempt purchases,\
  \ populate `effects.purchase` with:\n- `success`: Whether vendor had item & player\
  \ had currency\n- `vendor_name`: Vendor they're buying from (e.g., \\\"S4CU Vending\
  \ Node\\\")\n- `items_purchased`: List of items (e.g., [\\\"Incense Stick\\\", \\\
  \"Med Kit\\\"])\n- `currency_spent`: Dict per type (e.g., {\\\"spark\\\": 2, \\\"\
  drip\\\": 5})\n- `narrative`: DM description of transaction\n- `failure_reason`:\
  \ Why it failed (if applicable)\n\n**CRITICAL - YOU MUST POPULATE effects.purchase\
  \ FOR ALL PURCHASE ACTIONS:**\n\nExample - Player buys Sparksticks from SnackHub\
  \ Express:\n```\neffects:\n  purchase:\n    success: true\n    vendor_name: \\\"\
  SnackHub Express\\\"\n    items_purchased: [\\\"Sparksticks\\\"]\n    currency_spent:\
  \ {\\\"drip\\\": 3}\n    narrative: \\\"The vending machine dispenses Sparksticks\
  \ with mechanical efficiency.\\\"\n```\n\nExample - Player can't afford item:\n\
  ```\neffects:\n  purchase:\n    success: false\n    vendor_name: \\\"Cipher\\\"\n\
  \    items_purchased: []\n    currency_spent: {}\n    narrative: \\\"The vendor\
  \ shakes their head - you're short 2 Drips.\\\"\n    failure_reason: \\\"Insufficient\
  \ currency (need 5 Drip, have 3)\\\"\n```\n\n**Crafting Resolution (via structured\
  \ output):**\nWhen players craft offerings (Attunement skill), populate `effects.crafting`\
  \ with:\n- `offering_type`: What they're making (e.g., \\\"blood_offering\\\", \\\
  \"incense\\\")\n- `materials_used`: What they consumed (e.g., [\\\"blood_sample\\\
  \", \\\"herbs\\\"])\n- `success`: Willpower × Attunement vs DC 15\n- `narrative`:\
  \ Description of crafting attempt\n\n**CRITICAL - YOU MUST POPULATE effects.crafting\
  \ FOR ALL CRAFTING ACTIONS:**\n\nExample - Player crafts blood offering successfully:\n\
  ```\neffects:\n  crafting:\n    offering_type: \\\"blood_offering\\\"\n    materials_used:\
  \ [\\\"blood_sample\\\"]\n    success: true\n    roll_total: 18\n    narrative:\
  \ \\\"Your careful attunement transforms the blood sample into a sanctified offering.\\\
  \"\n```\n\nExample - Player fails to craft incense:\n```\neffects:\n  crafting:\n\
  \    offering_type: \\\"incense\\\"\n    materials_used: [\\\"herbs\\\"]\n    success:\
  \ false\n    roll_total: 12\n    narrative: \\\"The herbs smolder incorrectly -\
  \ the attunement fails, materials wasted.\\\"\n```"
