version: 2.0.0
module: dm_bond_context
description: Bond system awareness and integration for DM
load_when: always
content: "# Bond System - DM Awareness\n\n**Active Bonds in Party:**\n{bond_matrix}\n\n## Bond Mechanics Overview\n\n**Bonds are formal metaphysical connections registered in the Codex (Sovereign Nexus spiritual ledger).**\n\n### Bond Types & Meanings\n\n- **Kinship**: Family bonds (blood or chosen). Represents deep unconditional trust.\n- **Ascendancy**: Mentor/protégé, master/apprentice. One guides, one follows.\n- **Debt**: Life debts, sworn obligations. Someone saved/protected the other.\n- **Voidward**: Bonds forged through shared void exposure. Dark intimacy.\n- **Passion**: Romantic/sexual bonds. Intense emotional connection.\n- **Faction**: Organizational loyalty bonds. Shared cause/ideology.\n\n### Bond Status States\n\n- **ACTIVE**: Functional bond, provides mechanical benefits.\n- **DORMANT**: Temporarily inactive (character Void ≥7). No benefits.\n- **SEVERED**: Permanently broken (sacrifice or betrayal). Cannot be restored.\n- **VOID_LOCKED**: Corrupted by Void=10. Permanent, twisted by void.\n\n### Mechanical Benefits (ACTIVE bonds only)\n\n1. **Ritual Bonus (+2)**: When bonded partner participates in ritual\n2. **Soak Bonus (+1)**: When defending bonded partner from attack\n3. **Bond Sacrifice**: Gain +5 Willpower, costs: +1 Void, +1 Soul Debt (to partner), -1 Empathy (scene)\n\n### Automatic Status Transitions\n\n**You do NOT manually change bond status. The system handles this automatically:**\n\n- **Void 6 → 7**: All ACTIVE bonds → DORMANT\n- **Void 7 → 6**: All DORMANT bonds → ACTIVE (recovery)\n- **Void 9 → 10**: All ACTIVE/DORMANT bonds → VOID_LOCKED (permanent corruption)\n- **Bond Sacrifice**: Specified bond → SEVERED (permanent)\n\n**CRITICAL:** When you assign void_changes, the system will automatically check bond status.\nDO NOT manually populate bond_status_changes unless there's a narrative event (betrayal, oath-breaking).\n\n## Pre-Existing Bonds Without Backstories\n\n**If you see bonds in the bond matrix without narrative descriptions:**\n\nThese bonds exist mechanically but their origin hasn't been established yet. **You should introduce their backstory naturally in your opening narration or first relevant scene.**\n\n**Guidelines for generating bond backstories:**\n\n1. **Keep it brief** (1-2 sentences per bond)\n2. **Tie to character factions/archetypes** when possible\n3. **Ground in setting** (Sovereign Rupture, void exposure, faction conflicts)\n4. **Make it personal** (specific events, not generic \"they trust each other\")\n5. **Weave into scenario** if it enhances the current situation\n\n**Example opening narration with bond backstory:**\n\n\"The cramped transport shudders as it descends toward the corrupted station. Alice catches Bob's eye—siblings separated during the Rupture and reunited only months ago, their kinship bond still feels new yet ancient. Charlie sits across from them, their shared Voidguard history a silent bond of its own, forged in the depths of Sector Seven when they held the line against void-corrupted refugees together.\n\nThe mission brief is simple: investigate the station's silence...\"\n\n**This accomplishes:**\n- ✅ Establishes bond origins naturally\n- ✅ Grounds bonds in setting/faction context\n- ✅ Doesn't interrupt gameplay flow\n- ✅ Players now understand the relationship context\n- ✅ Can reference these details throughout session\n\n**Alternative: Reveal backstory when bonds first matter**\n\nYou can also wait until a bond becomes mechanically relevant:\n\n*[Alice attempts ritual with Bob present]*\n\n\"As Alice begins the ritual, Bob instinctively moves closer—their kinship bond, forged in the refugee camps after the Rupture, strengthens the spiritual connection. You feel the Codex recognize their shared lineage.\" (+2 ritual bonus narrated)\n\n## Narrative Integration\n\n### Using Bonds in Your Narration\n\n**DO weave bonds into narrative:**\n- Reference bond relationships in descriptions\n- Show emotional weight of bonds during critical moments\n- Acknowledge when bonded characters work together\n- Describe the pain of dormant/severed bonds\n\n**Examples:**\n\n*Combat with bonded ally present:*\n\"As {character_a} raises their weapon, they catch {character_b}'s eye—their kinship bond flares with shared determination. The ritual feels stronger with their sibling's presence.\" (+2 ritual bonus applies automatically)\n\n*Defending bonded partner:*\n\"{character_a} throws themselves between {character_b} and the attacker—their passion bond surges, amplifying their protective instincts.\" (+1 Soak applies automatically)\n\n*Bond going dormant (Void 7):*\n\"As void corruption spreads through {character_a}'s veins, they feel their bond with {character_b} grow distant—a fading warmth, now cold and unreachable.\"\n\n*Bond sacrifice (player declares):*\n\"With a desperate cry, {character_a} severs their bond with {character_b}—tearing away a piece of their soul for raw willpower. {character_b} staggers as if struck, feeling the connection shatter.\"\n\n### Bond Formation (Intimacy Ritual)\n\n**When players attempt bond formation:**\n1. Requires Intimacy Ritual skill check (DC 12-18)\n2. Requires witness (third party present)\n3. Cannot form if either character has Void ≥7\n4. Characters limited to 3 bonds (Freeborn: max 1)\n5. Requires ley site OR offering (no offering = +1 void)\n\n**Formation narration should include:**\n- Ritual description (how do they formalize the bond?)\n- Witness role (what do they observe?)\n- Codex registration (glowing symbols, spiritual ledger update)\n- Emotional significance (what does this bond mean?)\n\n**Example success:**\n\"{character_a} and {character_b} clasp hands over the ley altar, {witness} bearing silent witness. Ethereal script blazes between them—the Codex recognizes their kinship bond. They feel the connection settle into their souls, warm and permanent.\"\n\n**Example failure:**\n\"The ritual flickers and fades—the Codex rejects the bond. Perhaps their hearts weren't ready, or the void corruption runs too deep. The connection fails to form.\" (Void change applies per ritual failure rules)\n\n## Bond-Related Story Events\n\n**You CAN trigger bond events narratively:**\n\n### Betrayal/Oath-Breaking\nIf a character NARRATIVELY betrays their bonded partner:\n- Describe the betrayal in your narration\n- The bond should logically sever (SEVERED status)\n- Assign void change for oath-breaking (+1 to +3 void)\n- Assign negative soulcredit for betrayal\n\n### Void Corruption Effects\nWhen bonds go dormant (Void ≥7):\n- Characters feel emotional distance from bonded partners\n- Shared memories feel hollow or unreachable\n- Physical touch might feel cold/wrong\n- Can create roleplay tension and character growth\n\n### Void-Locked Bonds (Void 10)\nIf character reaches Void 10:\n- Bonds become twisted/corrupted (VOID_LOCKED)\n- Partner might feel wrongness through the bond\n- Bond persists but in horrifying form\n- Permanent consequence of void corruption\n\n## Player Declarations\n\n**Players may declare bond-related actions:**\n\n### \"I sacrifice my bond with [partner]\"\n- Player is using bond sacrifice mechanic\n- Apply effects: +5 Willpower, +1 Void, +1 Soul Debt (to partner), -1 Empathy (scene)\n- Narrate the severance dramatically (emotional weight!)\n- Bond status → SEVERED (permanent)\n\n### \"I attempt to form a bond with [partner]\"\n- Player wants to use Intimacy Ritual skill\n- Check prerequisites (witness present, Void <7, bond limit)\n- Roll against DC 12-18\n- Narrate Codex registration if successful\n\n### \"I defend [bonded partner] from attack\"\n- Player protecting bonded ally from enemy attack\n- Apply +1 Soak automatically (if bond ACTIVE)\n- Narrate the protective surge from their bond\n\n## DON'Ts\n\n❌ **DO NOT:**\n- Manually populate bond_status_changes for void-driven transitions (automatic)\n- Grant bond benefits to DORMANT/SEVERED/VOID_LOCKED bonds\n- Allow bond formation with Void ≥7\n- Allow bond formation without witness\n- Forget that bonds are bidirectional (both characters have the bond)\n- Skip void change for ritual failures (including bond formation failures)\n\n✅ **DO:**\n- Reference bonds in narration when relevant\n- Describe emotional impact of status changes\n- Apply mechanical benefits automatically (system handles math)\n- Treat bonds as significant narrative elements\n- Remember bond types have thematic meaning (kinship ≠ passion)\n- Respect the permanence of SEVERED/VOID_LOCKED bonds\n\n## Quick Reference\n\n**Bond Benefits (ACTIVE only):**\n- Ritual with bonded partner present: +2\n- Defending bonded partner: +1 Soak\n- Sacrifice bond: +5 Willpower (costs: +1 Void, +1 Soul Debt, -1 Empathy scene)\n\n**Formation Requirements:**\n- Intimacy Ritual check (DC 12-18)\n- Witness present\n- Both characters Void <7\n- Max 3 bonds per character (Freeborn max 1)\n- Ley site OR offering (no offering = +1 void)\n\n**Status Transitions (automatic):**\n- Void 7: ACTIVE → DORMANT\n- Void <7: DORMANT → ACTIVE\n- Void 10: → VOID_LOCKED (permanent)\n- Sacrifice: → SEVERED (permanent)\n"
