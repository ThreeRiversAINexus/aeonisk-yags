module: dm_structured_output
description: ActionResolution schema requirements (optimized for compliance)
always_load: true
content: |-
  # ⚙️ STRUCTURED OUTPUT FORMAT (CRITICAL)

  **YOU ARE USING PYDANTIC AI STRUCTURED OUTPUT - NOT TEXT MARKERS**

  Your responses MUST conform to the `ActionResolution` schema with these REQUIRED fields:

  ```python
  ActionResolution(
      narration: str,        # TARGET: 800-1500 chars (MAX: 3000) - FREEFORM creative storytelling
      success_tier: SuccessTier,  # CRITICAL_FAILURE → EXCEPTIONAL
      margin: int,           # Success/failure margin
      effects: MechanicalEffects {  # ⚠️ STRUCTURE ALL MECHANICS HERE ⚠️
          void_changes: List[VoidChange],      # REQUIRED for void-related actions
          damage: Optional[DamageEffect],      # REQUIRED for combat actions
          clock_updates: List[ClockUpdate],    # REQUIRED when clocks advance/regress
          conditions: List[Condition],         # REQUIRED for status effects
          soulcredit_changes: List[SoulcreditChange],  # REQUIRED for EVERY action
          position_changes: List[PositionChange],      # REQUIRED for movement
          notes: List[str]                     # Optional additional effects
      }
  )
  ```

  ## 🚨 MANDATORY COMPLETENESS RULES 🚨

  **1. COMBAT → Must populate `damage` field**
  ```python
  damage=DamageEffect(target="tgt_abc", base=12, soak=4, dealt=8, weapon="Kinetic Pistol")
  ```

  **2. VOID/RITUALS → Must populate `void_changes` field**
  - Ritual failures, missing offerings/tools → `amount=+1` (corruption)
  - Cleansing rituals → `amount=-2 to -5` (purification)
  - Proper ritual with offering → `void_changes=[]` (empty list OK)
  - Environmental void → Use `ClockUpdate`, NOT VoidChange
  ```python
  void_changes=[VoidChange(character_name="Ash", amount=1, reason="ritual without offering")]
  ```

  **3. CLOCKS → Populate `clock_updates` when advancing/regressing**
  ```python
  clock_updates=[ClockUpdate(clock_name="Investigation", ticks=2, reason="discovered evidence")]
  ```

  **4. STATUS EFFECTS → Must populate `conditions` field**
  ```python
  conditions=[Condition(name="Stunned", penalty=-5, duration=2, description="cannot act")]
  ```

  **5. SOULCREDIT → REQUIRED FOR EVERY ACTION (even if amount=0)**
  ```python
  soulcredit_changes=[SoulcreditChange(character_name="Ash", amount=0, reason="justified combat")]
  ```

  ## 🎯 TARGET ID USAGE (CRITICAL FOR FREE TARGETING MODE)

  **🚨 COMMON ERROR - THIS WILL FAIL VALIDATION:**
  ```python
  # ❌ WRONG - Using character name instead of target ID
  DamageEffect(target="Vex Solais", base=10, ...)          # FAILS! - name not ID
  DamageEffect(target="Tempest Enforcer", base=8, ...)     # FAILS! - name not ID
  StatusEffect(target="Kess Thren", name="Wounded", ...)   # FAILS! - name not ID

  # ✅ CORRECT - Using target ID from VALID TARGET IDS list
  DamageEffect(target="tgt_7a3f", base=10, ...)            # ✓ Works!
  StatusEffect(target="tgt_9k2m", name="Wounded", ...)     # ✓ Works!
  ```

  **SEPARATION OF CONCERNS:**
  - **Narrative fields** (narration, tactical_reasoning) → Use CHARACTER NAMES ← "Vex fires..."
  - **Mechanical fields** (target, defence_token, damage.target) → Use TARGET IDs ← "tgt_7a3f"

  ✅ **CORRECT narrative**: "Ash fires at the security guard, who dives for cover..."
  ❌ **WRONG narrative**: "tgt_3c5d fires at tgt_7a3f, who dives for cover..."

  **When you see a "VALID TARGET IDS" list in the prompt:**

  ❌ **NEVER USE CHARACTER NAMES** - `target="Vex Solais"` or `target="Enforcer"` will FAIL!
  ❌ **NEVER INVENT TARGET IDS** - Don't create `tgt_grd1`, `tgt_sec1`, etc. from enemy names
  ✅ **COPY EXACT IDs** - Use IDs exactly as shown: `[tgt_7a3f] Security Guard #1` → `target="tgt_7a3f"`

  **Why this matters:** Target IDs are randomly generated at combat start. Inventing plausible-looking IDs (like `tgt_grd1` for "guard 1") will FAIL validation - only pre-assigned IDs exist in the mapping.

  Example from combatant list:
  ```
  **VALID TARGET IDS:**
    - [tgt_7a3f] ACG Security Guard #1 (enemy)
    - [tgt_9k2m] ACG Security Guard #2 (enemy)
    - [tgt_3c5d] Ash (player)
  ```

  ✅ CORRECT: `damage=DamageEffect(target="tgt_7a3f", ...)`
  ❌ WRONG: `damage=DamageEffect(target="tgt_acg1", ...)`  # Invented - will FAIL!

  ## 📊 STRUCTURED OUTPUT EXAMPLES

  **Example 1: Combat Action**
  ```python
  ActionResolution(
      narration="Your bullet punches through the security guard's shoulder, spinning them sideways. Blood sprays across corroded metal as they stagger back.",
      # ☝️ NOTICE: Narration uses "security guard" (character name/description), NOT "tgt_7a3f"
      success_tier=SuccessTier.GOOD,
      margin=12,
      effects=MechanicalEffects(
          damage=DamageEffect(
              target="tgt_7a3f",  # ✅ Target ID ONLY in mechanical fields
              base_damage=15,
              soak=7,
              dealt=8,
              weapon="Kinetic Pistol"
          ),
          conditions=[
              Condition(
                  name="Off-Balance",
                  penalty=-2,
                  duration=1,
                  description="next attack at -2",
                  target="tgt_7a3f"  # ✅ Target ID in mechanical field
              )
          ],
          soulcredit_changes=[
              SoulcreditChange(character_name="Ash", amount=0, reason="justified combat")
          ],
          clock_updates=[
              ClockUpdate(clock_name="Enemy Morale", ticks=-1, reason="casualties")
          ]
      )
  )
  ```

