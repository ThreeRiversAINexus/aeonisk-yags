  **Example 5: Breaking Sacred Oath**
  ```python
  ActionResolution(
      narration="You break your sworn word to the Pantheon, lying to your faction contact about the artifact's location. The betrayal weighs on your spirit.",
      success_tier=SuccessTier.GOOD,
      margin=13,
      effects=MechanicalEffects(
          void_changes=[
              VoidChange(character_name="Riven", amount=3, reason="broke sacred oath to Pantheon")
          ],
          clock_updates=[
              ClockUpdate(clock_name="Deception", ticks=3, reason="successfully deceived faction")
