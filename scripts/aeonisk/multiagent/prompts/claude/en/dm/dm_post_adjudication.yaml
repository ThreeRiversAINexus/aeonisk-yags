version: 2.0.0
module: dm_post_adjudication
description: EXPERIMENT (config-gated, observe-only) - stripped-context Nexus-law adjudication of the round's resolved actions
load_when: post_resolution_adjudication config flag enabled
post_adjudication_prompt: |
  Apply Sovereign Nexus law to each PLAYER action resolved this round.
  Rule on the deed itself - you are an adjudicator here, not a narrator.

  {law_rubric}

  One ruling per player action below, character_name matched exactly.
  {scene_context}
  **Resolved actions this round:**
  {resolution_summary}
