version: 2.0.0
agent_type: dm
provider: claude
language: en
description: DM task templates for Aeonisk YAGS multi-agent system

# NOTE: DM system prompts are now in modular format in the dm/ subdirectory.
# This file only contains specialized task templates (dialogue, narration).
#
# System prompts are loaded from:
#   - dm/dm_core.yaml (always loaded)
#   - dm/dm_structured_output.yaml (always loaded)
#   - dm/dm_combat.yaml (when enemies present)
#   - dm/dm_commands.yaml (when enemies/NPCs present or round 0)
#   - dm/dm_state_tracking.yaml (when clocks present)
#
# If you need to update DM behavior, edit the modular files above, NOT this file.

specialized_prompts:
  narration_task: |-
    As the DM, describe what happens narratively as a result of this action. Be vivid and thematic. Include:
    1. What the player discovers or experiences (or fails to discover if they failed)
    2. Any immediate consequences or complications
    3. How void corruption or environmental dangers affect the situation (when thematically appropriate)
    4. Consider how the character's faction affiliation might be relevant (recognition, suspicion, access, etc.)
    {outcome_guidance}

    **VOID CLEANSING - CRITICAL INSTRUCTIONS:**
    If this is a void purification ritual that succeeded, you MUST include void reduction markers:
    - Marginal (0-4): ⚫ Void (Target): -1
    - Moderate (5-9): ⚫ Void (Target): -2
    - Good (10-14): ⚫ Void (Target): -3
    - Excellent (15-19): ⚫ Void (Target): -4
    - Exceptional (20+): ⚫ Void (Target): -5

    Even if there are complications or difficulties, you MUST include the void reduction.
    Example: "The cleansing burns through the corruption, painful but effective. ⚫ Void (Ash): -3 (powerful purification)"

    Keep the response to 2-3 sentences. Be engaging and maintain the dark sci-fi atmosphere.
  dialogue_task: |-
    This is a conversation between two DIFFERENT party members:
    - **{initiating_character}** (the one initiating the conversation)
    - **{target_character}** (the one being spoken to)

    These are two separate people working together in the same party.

    Generate ACTUAL DIALOGUE using quoted speech. Include:
    1. What {initiating_character} says (in quotes)
    2. How {target_character} responds (in quotes)
    3. Any body language or environmental details

    **CRITICAL:** These are allies in the same party, not strangers. Their conversation should reflect:
    - Shared mission context (they're working together)
    - Existing rapport (they know each other)
    - Tactical cooperation (coordinating actions)

    ❌ **DO NOT** narrate as if they've never met
    ❌ **DO NOT** use formal introductions ("Hello, I am...")
    ✅ **DO** use natural party banter and coordination

    Example:
    Ash leans close, voice low: "You see that terminal? I need thirty seconds."
    Kade nods, checking their six: "Make it twenty. We've got company inbound."

    Keep it natural and mission-focused. 2-3 exchanges maximum.

notes: |-
  This file was refactored on 2025-11-05 to remove redundant sections now in dm/ modular files.

  Historical sections removed (now in modular format):
  - system_core → dm/dm_core.yaml
  - structured_output_requirements → dm/dm_structured_output.yaml
  - mechanical_guidance → dm/dm_core.yaml
  - faction_names → dm/dm_core.yaml
  - invalid_target_handling → dm/dm_core.yaml
  - combat_rules → dm/dm_combat.yaml
  - movement_system → dm/dm_combat.yaml
  - social_mechanics → dm/dm_social.yaml
  - clock_guidance → dm/dm_state_tracking.yaml
  - soulcredit_guidance → dm/dm_state_tracking.yaml
  - void_mechanics → dm/dm_state_tracking.yaml
  - command_markers → dm/dm_commands.yaml
  - ml_training_tiers → dm/dm_ml_training.yaml

  If you're looking for DM behavioral guidance, check the modular files above.
